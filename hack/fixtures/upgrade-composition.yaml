apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: custom-runtime
  namespace: agents-upgrade
spec:
  backend:
    kind: custom
    image: upgrade-test-agent:dev
  execution:
    serviceAccountName: default
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentSkillSet
metadata:
  name: repository-review
  namespace: agents-upgrade
spec:
  skills:
    - name: evidence-first
      content: Inspect current evidence before drawing conclusions.
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentToolSet
metadata:
  name: repository-tools
  namespace: agents-upgrade
spec:
  tools:
    - name: repository-status
      verifyCommand: ["git", "status", "--short"]
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentCouncil
metadata:
  name: repository-council
  namespace: agents-upgrade
spec:
  members:
    - role: reviewer
      profileRef:
        name: legacy-review
  councilPrompt: Review the upgraded composition without expanding authority.
