# Anvil Primaris release contract for public operator anvil-agents.
# ApplicationRelease / local release-primaris must pass security before publish.
apiVersion: anvil.hazyforge.io/release/v1alpha1
kind: ReleaseContract
metadata:
  name: anvil-agents
  application: anvil-agents
spec:
  description: >-
    Standalone agent execution operator and runner images.
    Releases require standalone-operator verify and security TestContract suites
    (govulncheck, gosec, and Trivy for every container).
  testGateSuites:
    - standalone-operator
    - security
  notes: |
    Local:
      make verify
      make security              # source
      make security-trivy        # Trivy ×7 containers
      make security-release      # source + Trivy (Primaris release gate)
    GitHub (public Actions minutes — visible per-container check runs):
      - security.yml: trivy / controller … trivy / pi matrix
      - publish.yaml needs: [verify, security, trivy]
    Primaris:
      anvilctl test run --application anvil-agents --suite security
      anvilctl test run --application anvil-agents --gate release
      VERSION=vX.Y.Z make release-primaris-fast  # security-release then publish
      Evidence: dist/security/trivy/summary.txt RESULT=PASS
