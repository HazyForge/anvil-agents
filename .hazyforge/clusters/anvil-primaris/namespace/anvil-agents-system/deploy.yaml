helmChartPath: charts/anvil-agents

# Optional Hazy Forge consumer deployment discovered by the Anvil Primaris
# remote Helm ApplicationSet. Portable installations do not depend on it.
# Run one leader-elected controller in the system namespace. Agent workloads
# are distributed independently across eligible cluster nodes.
replicaCount: 1
serviceAccount:
  name: anvil-agents
image:
  # Controller/API image embeds Anvil Agents Console SPA (served at /).
  reference: ghcr.io/hazyforge/anvil-agents@sha256:2cd589f865ed2813fea6f6b85d0ee32f0bff155f830aebdba861560b519f7291
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-creds
runnerImages:
  codex: ghcr.io/hazyforge/anvil-agent-run-codex@sha256:d014026823632318e9bf464341cf568b97bb5ddbceb2459b2c8a69e033f6e90d
  openCode: ghcr.io/hazyforge/anvil-agent-run-opencode@sha256:b3a99b5636ad7884313fdd1a96fa4c7d477151cdf2648719b47291d7f87e453a
  hermesAgent: ghcr.io/hazyforge/anvil-agent-run-hermes@sha256:b05b62714a51b43462ed78871591c97bad7977960c560db1e879a1d1a23a4461
  openClaw: ghcr.io/hazyforge/anvil-agent-run-openclaw@sha256:54e1e687fce0ae8a98ef23da239a592f49bc588d918ffc800fbb23bb21c9bf50
  grokBuild: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:202988e8a8263202f0f85acb0d8897a09cc83d90408cdb940bb29d3084127f2a
  piAgent: ghcr.io/hazyforge/anvil-agent-run-pi@sha256:f4a5d9ecc20d51ce672cd9d89ed5f78cc039aecd2e76f684d6aaac0017148d6a
crds:
  install: true
leaderElection: true
applicationMaxConcurrentRuns: 4
defaultStorageClass: observability-local
externalSecrets:
  enabled: true
# Keep the legacy source list until this overlay pins a controller image that
# supports structured adverseSources. The chart omits the new flag while the
# structured list is empty, preserving compatibility with this pinned image.
adverseSourceGVKs:
  - control.anvil.hazyforge.io/v1alpha1/ApplicationRelease
  - control.anvil.hazyforge.io/v1alpha1/ArtifactBuild
  - control.anvil.hazyforge.io/v1alpha1/IOSBuild
  - control.anvil.hazyforge.io/v1alpha1/AnvilTask
  - control.anvil.hazyforge.io/v1alpha1/TestRun
extraRBACRules:
  - apiGroups: [control.anvil.hazyforge.io]
    resources: [applicationreleases, artifactbuilds, iosbuilds, anviltasks, testruns]
    verbs: [get, list, watch]
archive:
  databaseURLSecret:
    name: anvilhub-inventory-database
    key: database-url
  terminalRetention: 72h
# The read-only API uses the existing Anvil Primaris resource audience and an
# explicit compatibility binding. Replace this administrative role with the
# narrower anvil_agents_viewer role when that role is provisioned in ZITADEL.
api:
  enabled: true
  config:
    oidc:
      issuer: https://hazyforge1-azsbgb.us1.zitadel.cloud
      audiences:
        - "376124473528572432"
    authorization:
      roleClaims: []
      roleObjectClaims:
        - urn:zitadel:iam:org:project:376124473528572432:roles
      bindings:
        - name: anvil-primaris-admin-compatibility
          roles:
            - anvil_primaris_admin
          permissions:
            - anvil-agents:runs:read
            - anvil-agents:runs:stream
          namespaces:
            - anvilhub
            - hazy-trade
    cors:
      # Exact browser Origin for the console + API host (deny-by-default).
      allowedOrigins:
        - https://agents.anvil.hazyforge.io
    ui:
      productTitle: Anvil Agents Console
      defaultNamespaces:
        - hazy-trade
        - anvilhub
      oidc:
        # ZITADEL User-Agent app "Anvil Agents Console" on project Anvil Primaris.
        clientId: "383499920822362966"
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: gateway
        sectionName: https-agents-anvil-hazyforge-io
    hostnames:
      - agents.anvil.hazyforge.io
extraVolumes:
  - name: anvilhub-inventory-database
    secret:
      secretName: anvilhub-inventory-database
extraVolumeMounts:
  - name: anvilhub-inventory-database
    mountPath: /etc/anvilhub/inventory-database
    readOnly: true
nodeSelector:
  kubernetes.io/arch: amd64
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: anvilhub
        namespaces:
          - anvilhub
        topologyKey: kubernetes.io/hostname
