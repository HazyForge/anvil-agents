helmChartPath: charts/anvil-agents

# Bootstrap is intentionally inert. The coordinated cutover publishes and pins
# immutable image digests before changing this replica count to one.
replicaCount: 0
serviceAccount:
  name: anvil-agents
image:
  reference: ghcr.io/hazyforge/anvil-agents@sha256:387b37dfa3c1940b858dc02dbd93ffd29b497cfeb24dcf35d9b9bb8421ddaffa
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-creds
runnerImages:
  codex: ghcr.io/hazyforge/anvil-agent-run-codex@sha256:d89acf145d0db4a386c69214b1764c3199c7b1656487b619ffd3a86f7c9f0e47
  hermesAgent: ghcr.io/hazyforge/anvil-agent-run-hermes@sha256:afd4f3d4858062835ac27bac52f529a429b949ee632a79f6c13546374782328f
  openClaw: ghcr.io/hazyforge/anvil-agent-run-openclaw@sha256:58d70d53acc2a1267eed0d62e867d8cc804bd6e467f6dc908170c0a2225ff2ee
  grokBuild: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:a67289b5e3021ec4303185fca3c6f11d18b656be999c24279885ed74855a7194
  piAgent: ghcr.io/hazyforge/anvil-agent-run-pi@sha256:48e051914e51d7af3017fd5c09ad29753760e45ec23fd4a1ca93608bec499143
crds:
  install: true
leaderElection: true
applicationMaxConcurrentRuns: 4
defaultStorageClass: observability-local
externalSecrets:
  enabled: true
adverseSourceGVKs:
  - control.anvil.hazyforge.io/v1alpha1/ApplicationRelease
  - control.anvil.hazyforge.io/v1alpha1/ArtifactBuild
  - control.anvil.hazyforge.io/v1alpha1/IOSBuild
  - control.anvil.hazyforge.io/v1alpha1/AnvilTask
  - control.anvil.hazyforge.io/v1alpha1/TestRun
extraRBACRules:
  - apiGroups: [control.anvil.hazyforge.io]
    resources: [applicationreleases, artifactbuilds, iosbuilds, anviltasks, testruns]
    verbs: [get, list, watch]
archive:
  databaseURLSecret:
    name: anvilhub-inventory-database
    key: database-url
  terminalRetention: 72h
# OIDC claim shapes are staged, but the API stays disabled until a dedicated
# audience and explicit namespace grants are configured.
api:
  enabled: false
  config:
    oidc:
      issuer: https://hazyforge1-azsbgb.us1.zitadel.cloud
    authorization:
      roleClaims:
        - roles
      roleObjectClaims:
        - urn:zitadel:iam:org:project:roles
        - urn:zitadel:iam:org:projects:roles
        - urn:zitadel:iam:org:project:376124473528572432:roles
extraVolumes:
  - name: anvilhub-inventory-database
    secret:
      secretName: anvilhub-inventory-database
extraVolumeMounts:
  - name: anvilhub-inventory-database
    mountPath: /etc/anvilhub/inventory-database
    readOnly: true
nodeSelector:
  kubernetes.io/arch: amd64
