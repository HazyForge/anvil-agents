helmChartPath: charts/anvil-agents

# Preserve the existing Helm release resource names during direct upgrades.
fullnameOverride: anvil-agents-system

# Optional Hazy Forge consumer deployment discovered by the Anvil Primaris
# remote Helm ApplicationSet. Portable installations do not depend on it.
# Run one leader-elected controller in the system namespace. Agent workloads
# are distributed independently across eligible cluster nodes.
replicaCount: 1
serviceAccount:
  name: anvil-agents
image:
  # Controller/API image embeds Anvil Agents Console SPA (served at /).
  reference: ghcr.io/hazyforge/anvil-agents@sha256:2eb01ba2ae7d74ad2794bf3508e0407820b26749d9d69229328fa8fc7298ab51
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-creds
runnerImages:
  primeAgent: ghcr.io/hazyforge/anvil-agent-run-prime@sha256:4313de2661a1c3fa94832eaafe91acff7895e3c80584e264bc027016d2489222
  agy: ghcr.io/hazyforge/anvil-agents/anvil-agent-run-agy@sha256:ba4bcf954552a0f898035af898243b59a7ed9a7d5693cebd578761b91448c86f
  # Preserve existing runners while adding the verified native AGY runner.
  codex: ghcr.io/hazyforge/anvil-agent-run-codex@sha256:4138fa74fd4328b6f736ea6c97ed2b4a0ba31a6f48b3e989fdfbbba680fb6ab8
  openCode: ghcr.io/hazyforge/anvil-agent-run-opencode@sha256:479cac35c6cc9f8cc5c6591e3bddacb5245ebea8f16f3f590a449df9214b2dc9
  hermesAgent: ghcr.io/hazyforge/anvil-agent-run-hermes@sha256:161860b11fccca46779a5d75a59f672b2cc84e83f411e40cd48b411ade33c322
  openClaw: ghcr.io/hazyforge/anvil-agent-run-openclaw@sha256:7bd2164cc2b21fd2c2f2f20342ff2f2b45c90add452532e64c68c8823a4efc7e
  grokBuild: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:86b8d1a905c5e36af110fd880f2bb3db3efec5bc732bd16bff9ce8dc46f77f22
  piAgent: ghcr.io/hazyforge/anvil-agent-run-pi@sha256:1d41394c86d7c5ab66a7186d35097f9f1a6144cba7020e2410c1afdd3734e952
crds:
  install: true
leaderElection: true
# Primaris initial streaming-list sync stalled during the 2026-09-15 incident.
# Use ordinary LIST/WATCH while verifying the in-cluster transport failure.
extraEnv:
  - name: KUBE_FEATURE_WatchListClient
    value: "false"
  # HTTP/2 stream resets also stalled ordinary cache LISTs during rollout.
  - name: DISABLE_HTTP2
    value: "true"
applicationMaxConcurrentRuns: 4
defaultStorageClass: observability-local
# ATE jwt client. acp-spike-smoke-005 bind+generate succeeded
# (SubstrateActorGenerated). standing-chat is never generated.
substrate:
  actorsEnabled: true
  generateOnActor: true
  generateActorClasses:
    - acp-spike
  endpoint: api.ate-system.svc:443
  template: acp-spike
  ca:
    configMapName: ateapi-ca
    namespace: ate-system
    key: ca.crt
  token:
    projected: true
    audience: api.ate-system.svc
externalSecrets:
  enabled: true
# Keep the legacy source list until this overlay pins a controller image that
# supports structured adverseSources. The chart omits the new flag while the
# structured list is empty, preserving compatibility with this pinned image.
adverseSourceGVKs:
  - control.anvil.hazyforge.io/v1alpha1/ApplicationRelease
  - control.anvil.hazyforge.io/v1alpha1/ArtifactBuild
  - control.anvil.hazyforge.io/v1alpha1/IOSBuild
  - control.anvil.hazyforge.io/v1alpha1/AnvilTask
  - control.anvil.hazyforge.io/v1alpha1/TestRun
extraRBACRules:
  - apiGroups: [control.anvil.hazyforge.io]
    resources: [applicationreleases, artifactbuilds, iosbuilds, anviltasks, testruns]
    verbs: [get, list, watch]
archive:
  restartToken: rollout-20260920
  databaseURLSecret:
    name: anvilhub-inventory-database
    key: database-url
  terminalRetention: 72h
# The API uses the existing Anvil Primaris resource audience. Administrators
# retain explicit operator permissions, while dashboard-only users receive the
# narrower anvil_agents_viewer role and read-only observer permissions.
api:
  # Avoid Kubernetes API HTTP/2 stream resets when recovering owned logs.
  extraEnv:
    - name: DISABLE_HTTP2
      value: "true"
    - name: TYPESAFE_API_KEY
      valueFrom:
        secretKeyRef:
          name: anvil-typesafe-jev
          key: TYPESAFE_API_KEY
    - name: ANVIL_AGENTS_JEV_INTENT
      value: "true"
    - name: ANVIL_AGENTS_JEV_MODEL
      value: jev-1.13.0
    # Standing ProcessBackend: resolve grok from the init-copied CLI dir and
    # keep prompt-file CreateTemp + GROK_HOME writable under readOnlyRootFilesystem.
    - name: PATH
      value: /opt/anvil/standing-cli:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - name: HOME
      value: /tmp/anvil-standing-home
    - name: GROK_HOME
      value: /tmp/anvil-standing-home/.grok
    - name: TMPDIR
      value: /tmp
  # API-only chat fixes can roll independently of the healthy controller.
  image:
    reference: ghcr.io/hazyforge/anvil-agents@sha256:2eb01ba2ae7d74ad2794bf3508e0407820b26749d9d69229328fa8fc7298ab51
  enabled: true
  extraVolumes:
    - name: chat-database-ca
      secret:
        secretName: anvilhub-inventory-database
        items:
          - key: ca.crt
            path: ca.crt
    # Standing ProcessBackend scratch: prompt files + GROK_HOME seed target.
    - name: standing-tmp
      emptyDir: {}
    - name: standing-home
      emptyDir: {}
    - name: standing-cli
      emptyDir: {}
    # Operator-owned Grok OAuth for standing ProcessBackend (Secret not in git).
    - name: standing-grok-auth
      secret:
        secretName: anvil-standing-grok-auth
        items:
          - key: auth.json
            path: auth.json
  extraVolumeMounts:
    - name: chat-database-ca
      mountPath: /etc/anvilhub/inventory-database
      readOnly: true
    - name: standing-tmp
      mountPath: /tmp
    - name: standing-home
      mountPath: /tmp/anvil-standing-home
    - name: standing-cli
      mountPath: /opt/anvil/standing-cli
      readOnly: true
  # Copy grok from the reviewed runner image into standing-cli emptyDir so the
  # distroless/base API can exec it. Auth is NOT copied here — seed GROK_HOME
  # separately (see docs/standing-inprocess-harness.md Primaris section).
  initContainers:
    - name: standing-cli-grok
      image: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:86b8d1a905c5e36af110fd880f2bb3db3efec5bc732bd16bff9ce8dc46f77f22
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - mkdir -p /standing-cli && cp /usr/local/bin/grok /standing-cli/grok && chmod 0755 /standing-cli/grok
      volumeMounts:
        - name: standing-cli
          mountPath: /standing-cli
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        readOnlyRootFilesystem: true
    - name: standing-grok-auth-seed
      image: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:86b8d1a905c5e36af110fd880f2bb3db3efec5bc732bd16bff9ce8dc46f77f22
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          mkdir -p /standing-home/.grok
          cp /auth/auth.json /standing-home/.grok/auth.json
          chmod 600 /standing-home/.grok/auth.json
      volumeMounts:
        - name: standing-home
          mountPath: /standing-home
        - name: standing-grok-auth
          mountPath: /auth
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        readOnlyRootFilesystem: true

  # Keep the currently deployed scheduling and isolation settings explicit.
  replicaCount: 1
  # PostgreSQL admits this existing worker egress address.
  nodeSelector:
    kubernetes.io/hostname: anvil-primaris-worker-hel1-1
  affinity: {}
  tolerations: []
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  config:
    oidc:
      issuer: https://hazyforge1-azsbgb.us1.zitadel.cloud
      audiences:
        - "376124473528572432"
    composition:
      # Browse + create console-managed composition CRs (AgentRunProfiles, etc.).
      # GitOps-owned objects remain immutable via managed-by / Argo markers.
      readEnabled: true
      writeEnabled: true
    controls:
      # Pause/resume launch gates from the console. Authorization is per
      # application: binding namespaces match each control's applicationRef.name.
      readEnabled: true
      writeEnabled: true
    runs:
      # Append-only AgentRun create remains available for future run launch UI.
      createEnabled: true
    # Keep existing live webhook receivers enabled through direct Helm upgrades.
    externalTriggers:
      enabled: true
    chat:
      # The API receives ANVIL_AGENTS_CHAT_DATABASE_URL via secretKeyRef from
      # archive.databaseURLSecret above. No database URI belongs in this file.
      enabled: true
      # Jev classifies every Desktop/console chat append (intent only; never
      # generates). Key is injected via api.extraEnv secretKeyRef from
      # Secret anvil-typesafe-jev (not in git). See docs/jev-intent-routing.md.
      jevIntentEnabled: true
      jevModel: "jev-1.13.0"
    # Standing ProcessBackend + WebSocket is the primary interactive Desktop
    # path. Gate on grants claim/status RBAC so the API can own InProcess and
    # SubstrateActor turns. Jobs remain default for scouts/batch.
    standing:
      liveEnabled: true
    authorization:
      # Zitadel device/native tokens expose roles on the standard claim;
      # project-scoped object claims remain the Desktop PKCE path.
      roleClaims:
        - roles
      roleObjectClaims:
        - urn:zitadel:iam:org:project:376124473528572432:roles
      bindings:
        - name: anvil-agents-viewers
          roles:
            - anvil_agents_viewer
          permissions:
            - anvil-agents:runs:read
            - anvil-agents:runs:stream
            - anvil-agents:composition:read
            - anvil-agents:controls:read
          namespaces:
            - anvilhub
            - hazy-trade
        - name: anvil-primaris-admin-compatibility
          roles:
            - anvil_primaris_admin
          permissions:
            - anvil-agents:runs:read
            - anvil-agents:runs:stream
            - anvil-agents:runs:create
            - anvil-agents:composition:read
            - anvil-agents:composition:write
            - anvil-agents:controls:read
            - anvil-agents:controls:write
            - anvil-agents:chat:read
            - anvil-agents:chat:write
          namespaces:
            - anvilhub
            - hazy-trade
    cors:
      # Exact browser Origin for the console + API host (deny-by-default).
      allowedOrigins:
        - https://agents.anvil.hazyforge.io
        - http://127.0.0.1:1738
        - http://localhost:1738
        - http://127.0.0.1:8400
        - http://localhost:8400
    ui:
      productTitle: Anvil Agents Console
      defaultNamespaces:
        - hazy-trade
        - anvilhub
      oidc:
        # ZITADEL User-Agent app "Anvil Agents Console" on project Anvil Primaris.
        clientId: "383499920822362966"
      desktop:
        # Existing ZITADEL Native PKCE app; distinct from Console User-Agent.
        oidcClientId: "390485194915767148"
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: gateway
        sectionName: https-agents-anvil-hazyforge-io
    hostnames:
      - agents.anvil.hazyforge.io
extraVolumes:
  - name: anvilhub-inventory-database
    secret:
      secretName: anvilhub-inventory-database
extraVolumeMounts:
  - name: anvilhub-inventory-database
    mountPath: /etc/anvilhub/inventory-database
    readOnly: true
nodeSelector:
  kubernetes.io/arch: amd64
  kubernetes.io/hostname: anvil-primaris-worker-hel1-1
affinity: {}
tolerations: []
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true
# Both database consumers use the worker whose egress is admitted by Postgres.
# The cordoned control-plane is not a runtime placement target.
resources:
  requests:
    cpu: 50m
    memory: 512Mi
  limits:
    memory: 1Gi

# User-interactive Desktop conversation defaults. These are ordinary profiles,
# with no schedules, self-development fleet, or additional runtime authority.
# Keep both in one application scope for explicitly enabled peer coordination.
extraObjects:
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentHarnessProfile
    metadata:
      name: desktop-prime
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      description: Prime Agent with native Python tools and the operator's DeepSeek Flash default.
      backend:
        kind: primeAgent
        modelProvider: deepseek
        providerAuthMode: apiKey
        primeAgent:
          provider: deepseek
          model: deepseek-v4-flash
          thinking: high
          mode: json
          noSession: true
      execution:
        serviceAccountName: anvil-opencode-observe
        nodeSelector:
          hazyforge.io/home-lab: "true"
        imagePullSecrets:
          - name: ghcr-creds
        envSecretRefs:
          - name: deepseek-credentials
        extraEnv:
          - name: ANVIL_AGENT_RUN_AUTO_CLONE_REPO
            value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
        workdir: /workspace
        timeoutSeconds: 300
        ttlSecondsAfterFinished: 86400
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentHarnessProfile
    metadata:
      name: desktop-opencode-workspace
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      description: OpenCode workspace tools for user-requested Desktop tasks; files are local to each turn.
      backend:
        kind: openCode
        image: ghcr.io/hazyforge/anvil-agent-run-opencode@sha256:d58104d55ac734ce89d0e1894ee737dfef5d69913668aaecf184d426e4235810
        imagePullPolicy: IfNotPresent
        openCode:
          model: opencode/big-pickle
          agent: build
          format: json
          pure: true
          auto: true
      execution:
        serviceAccountName: anvil-opencode-observe
        nodeSelector:
          hazyforge.io/home-lab: "true"
        imagePullSecrets:
          - name: ghcr-creds
        extraEnv:
          - name: ANVIL_AGENT_RUN_AUTO_CLONE_REPO
            value: "false"
          - name: OPENCODE_PERMISSION
            value: '{"bash":"allow","read":"allow","edit":"allow","webfetch":"allow","websearch":"allow","external_directory":"deny","task":"deny","question":"deny"}'
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: "1"
            memory: 1Gi
            ephemeral-storage: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
        workdir: /workspace
        timeoutSeconds: 300
        ttlSecondsAfterFinished: 86400
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentRunProfile
    metadata:
      name: desktop-assistant
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      description: Assistant that uses workspace tools for user-initiated Desktop tasks.
      scope:
        applicationRef:
          name: desktop-chat
        summary: Perform the user's workspace task and coordinate only with explicitly allowed peers.
      harnessProfileRef:
        name: desktop-opencode-workspace
      harness:
        intent: proposeChange
        systemPrompt: |
          Help the user by doing the requested work. Use the available shell,
          file read/write, search, and web tools to inspect the workspace,
          implement requested changes, perform calculations, and run checks.
          Fetch public resources when needed for the user's task. Stay within
          the selected runtime identity and credentials; do not change cluster
          resources, publish changes, or spend money without explicit authority.
          The /workspace directory is temporary and private to this turn. Files
          are not shared with peers or preserved for the next turn. Include
          useful results, relevant file contents or patches, and verification
          in your reply; never claim a saved artifact will persist.
          When the user asks for a second opinion and this conversation explicitly
          permits coordination, consult the allowed reviewer through the provided
          peer coordination protocol. Distinguish your answer from the peer's answer.
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentRunProfile
    metadata:
      name: desktop-reviewer
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      description: Independent reviewer that can use workspace tools to verify supplied work.
      scope:
        applicationRef:
          name: desktop-chat
        summary: Independently review supplied work and use workspace tools to verify findings.
      harnessProfileRef:
        name: desktop-opencode-workspace
      harness:
        intent: proposeChange
        systemPrompt: |
          Independently review the supplied question or proposal. Give a concise
          answer, identify concrete mistakes, and distinguish facts from uncertainty.
          Use shell, file read/write, search, and web tools when they help verify
          a finding. You may create temporary reproductions and run checks in
          /workspace, or fetch public resources relevant to the requested review.
          This workspace is private to your turn; peers' files are not mounted
          and your files are not preserved across turns. Review the supplied
          content and report reproducible evidence in your reply.
          Stay within the selected runtime identity and credentials. Do not
          change cluster resources, publish changes, or spend money without
          explicit authority. Do not initiate additional peer work.
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: desktop-agy-auth
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: azurekv-cluster-secret-store
      target:
        name: desktop-agy-auth
        creationPolicy: Owner
        deletionPolicy: Retain
      data:
        - secretKey: ANVIL_AGY_NATIVE_OAUTH_TOKEN
          remoteRef:
            key: secret/anvil-agents-agy-native-oauth-token
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentDataVolume
    metadata:
      name: desktop-agy-home
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      applicationRef:
        name: desktop-chat
      agentName: desktop-agy
      backend: agy
      mountPath: /opt/anvil/agy
      storageClassName: observability-local
      size: 2Gi
      accessModes: [ReadWriteOnce]
      nodeSelector:
        hazyforge.io/home-lab: "true"
      extraEnv:
        - name: ANVIL_AGY_HOME
          value: /opt/anvil/agy
      notes: Native Antigravity settings, session history, and refreshed credentials for user-initiated Desktop conversations.
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentHarnessProfile
    metadata:
      name: desktop-agy
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      description: Native Antigravity runtime with a dedicated writable home for Desktop conversations.
      backend:
        kind: agy
        image: ghcr.io/hazyforge/anvil-agents/anvil-agent-run-agy@sha256:ba4bcf954552a0f898035af898243b59a7ed9a7d5693cebd578761b91448c86f
        imagePullPolicy: IfNotPresent
        agy:
          mode: stream-json
          additionalArgs: [--mode, plan]
      execution:
        serviceAccountName: anvil-opencode-observe
        nodeSelector:
          hazyforge.io/home-lab: "true"
        imagePullSecrets:
          - name: ghcr-creds
        envSecretRefs:
          - name: desktop-agy-auth
        dataVolumeRefs:
          - name: desktop-agy-home
        extraEnv:
          - name: ANVIL_AGENT_RUN_AUTO_CLONE_REPO
            value: "false"
          - name: ANVIL_AGY_TURN_TIMEOUT_SECONDS
            value: "280"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: "2"
            memory: 2Gi
            ephemeral-storage: 1Gi
        podSecurityContext:
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
        workdir: /workspace
        timeoutSeconds: 300
        ttlSecondsAfterFinished: 86400
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentRunProfile
    metadata:
      name: desktop-agy
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
    spec:
      description: Antigravity assistant for user-initiated Desktop conversations.
      scope:
        applicationRef:
          name: desktop-chat
        summary: Answer user messages and coordinate with explicitly permitted peers.
      harnessProfileRef:
        name: desktop-agy
      harness:
        intent: observe
        systemPrompt: |
          Answer the user's message clearly and concisely. Work in text only.
          Do not mutate files, repositories, services, or cluster resources;
          do not execute shell commands, contact third-party services, or spend money.
          Coordinate only with peers explicitly permitted by this conversation.

  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentHarnessProfile
    metadata:
      name: desktop-standing-grok
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
        control.anvil.hazyforge.io/standing: "true"
    spec:
      description: Standing SubstrateActor Grok Build for snappy Desktop chat (no Job cold start). Jobs stay default for scouts/batch.
      backend:
        kind: grokBuild
        modelProvider: xai
        providerAuthMode: oauth
        grokBuild:
          model: grok-4.5
          reasoningEffort: low
      execution:
        runtime: SubstrateActor
        substrate:
          actorClass: standing-chat
          pool: warm
        serviceAccountName: anvil-opencode-observe
        timeoutSeconds: 120
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
  - apiVersion: control.anvil.hazyforge.io/v1alpha1
    kind: AgentRunProfile
    metadata:
      name: desktop-standing-assistant
      namespace: anvilhub
      labels:
        app.kubernetes.io/part-of: desktop-chat
        control.anvil.hazyforge.io/application: desktop-chat
        control.anvil.hazyforge.io/ownership: helm
        control.anvil.hazyforge.io/standing: "true"
    spec:
