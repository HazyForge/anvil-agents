helmChartPath: charts/anvil-agents

# Optional Hazy Forge consumer deployment discovered by the Anvil Primaris
# remote Helm ApplicationSet. Portable installations do not depend on it.
# Run one leader-elected controller in the system namespace. Agent workloads
# are distributed independently across eligible cluster nodes.
replicaCount: 1
serviceAccount:
  name: anvil-agents
image:
  # Controller/API image embeds Anvil Agents Console SPA (served at /).
  reference: ghcr.io/hazyforge/anvil-agents@sha256:8dd64485be025abc3994fa26346f44a5c879654b35bfef0a566e7a02f6436377
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-creds
runnerImages:
  codex: ghcr.io/hazyforge/anvil-agent-run-codex@sha256:d2e12a7da81e6f9dbab6ca2b39660e6be387fe22ca456500396bc70211a6dd07
  openCode: ghcr.io/hazyforge/anvil-agent-run-opencode@sha256:c0ce2dd789009579cf3db04cedd2e3157bddd8a7c78d9d689cec4e10a027ed72
  hermesAgent: ghcr.io/hazyforge/anvil-agent-run-hermes@sha256:9e555d7bbda8cf4089913f74a82d9748d7e3f4a4430af3230426561c86cad2ca
  openClaw: ghcr.io/hazyforge/anvil-agent-run-openclaw@sha256:6448f31c5cf0b654570b3ddbc96e5d5a570e6ded7ee132e0a750c38fd59642f6
  grokBuild: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:48f744181761dcb754160b311c733cb13256eb90bced4d9f3e405bedf7f8298b
  piAgent: ghcr.io/hazyforge/anvil-agent-run-pi@sha256:47fb8544cd1c10956c3198d9d1cc6fc9fcdfe4f782f1fbf96c3acd15cfb4ba1d
crds:
  install: true
leaderElection: true
applicationMaxConcurrentRuns: 4
defaultStorageClass: observability-local
externalSecrets:
  enabled: true
# Keep the legacy source list until this overlay pins a controller image that
# supports structured adverseSources. The chart omits the new flag while the
# structured list is empty, preserving compatibility with this pinned image.
adverseSourceGVKs:
  - control.anvil.hazyforge.io/v1alpha1/ApplicationRelease
  - control.anvil.hazyforge.io/v1alpha1/ArtifactBuild
  - control.anvil.hazyforge.io/v1alpha1/IOSBuild
  - control.anvil.hazyforge.io/v1alpha1/AnvilTask
  - control.anvil.hazyforge.io/v1alpha1/TestRun
extraRBACRules:
  - apiGroups: [control.anvil.hazyforge.io]
    resources: [applicationreleases, artifactbuilds, iosbuilds, anviltasks, testruns]
    verbs: [get, list, watch]
archive:
  databaseURLSecret:
    name: anvilhub-inventory-database
    key: database-url
  terminalRetention: 72h
# The read-only API uses the existing Anvil Primaris resource audience and an
# explicit compatibility binding. Replace this administrative role with the
# narrower anvil_agents_viewer role when that role is provisioned in ZITADEL.
api:
  enabled: true
  config:
    oidc:
      issuer: https://hazyforge1-azsbgb.us1.zitadel.cloud
      audiences:
        - "376124473528572432"
    composition:
      # Browse + create console-managed composition CRs (AgentRunProfiles, etc.).
      # GitOps-owned objects remain immutable via managed-by / Argo markers.
      readEnabled: true
      writeEnabled: true
    runs:
      # Append-only AgentRun create remains available for future run launch UI.
      createEnabled: true
    authorization:
      roleClaims: []
      roleObjectClaims:
        - urn:zitadel:iam:org:project:376124473528572432:roles
      bindings:
        - name: anvil-primaris-admin-compatibility
          roles:
            - anvil_primaris_admin
          permissions:
            - anvil-agents:runs:read
            - anvil-agents:runs:stream
            - anvil-agents:runs:create
            - anvil-agents:composition:read
            - anvil-agents:composition:write
          namespaces:
            - anvilhub
            - hazy-trade
    cors:
      # Exact browser Origin for the console + API host (deny-by-default).
      allowedOrigins:
        - https://agents.anvil.hazyforge.io
    ui:
      productTitle: Anvil Agents Console
      defaultNamespaces:
        - hazy-trade
        - anvilhub
      oidc:
        # ZITADEL User-Agent app "Anvil Agents Console" on project Anvil Primaris.
        clientId: "383499920822362966"
  httpRoute:
    enabled: true
    parentRefs:
      - name: gateway
        namespace: gateway
        sectionName: https-agents-anvil-hazyforge-io
    hostnames:
      - agents.anvil.hazyforge.io
extraVolumes:
  - name: anvilhub-inventory-database
    secret:
      secretName: anvilhub-inventory-database
extraVolumeMounts:
  - name: anvilhub-inventory-database
    mountPath: /etc/anvilhub/inventory-database
    readOnly: true
nodeSelector:
  kubernetes.io/arch: amd64
affinity:
  podAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: anvilhub
        namespaces:
          - anvilhub
        topologyKey: kubernetes.io/hostname
