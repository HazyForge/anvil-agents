apiVersion: infrastructure.anvil.hazyforge.io/v1alpha1
kind: Repository
metadata:
  name: hazyforge-anvil-agents
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider: github
  cloneURL: https://github.com/HazyForge/anvil-agents.git
  defaultBranch: master
  defaultCheckoutPath: /workspace/anvil-agents
  sourceCredentialRef:
    name: anvil-primaris-source-read
  github:
    owner: HazyForge
    name: anvil-agents
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: Application
metadata:
  name: anvil-agents
  labels:
    app.kubernetes.io/name: anvil-agents
    app.kubernetes.io/part-of: anvilhub
spec:
  displayName: Anvil Agents
  description: Standalone open-source agent execution operator and backend runner images.
  repositoryRef:
    name: hazyforge-anvil-agents
  components:
    - &component
      name: controller
      type: OCIImage
      source: {repository: primary, path: .}
      artifactNamespace: ghcr.io/hazyforge/anvil-agents
      buildActionRef: &build-action
        type: artifact.build
        version: v2
        definitionDigest: sha256:431a6a1a6747e75caebbb9e2707bfd5d5063c699d16299ca01ae4110b1a0e080
    - <<: *component
      name: codex-runner
      source: {repository: primary, path: docker/agent-run-codex}
      artifactNamespace: ghcr.io/hazyforge/anvil-agent-run-codex
    - <<: *component
      name: grok-build-runner
      source: {repository: primary, path: docker/agent-run-grok-build}
      artifactNamespace: ghcr.io/hazyforge/anvil-agent-run-grok-build
    - <<: *component
      name: hermes-runner
      source: {repository: primary, path: docker/agent-run-hermes}
      artifactNamespace: ghcr.io/hazyforge/anvil-agent-run-hermes
    - <<: *component
      name: openclaw-runner
      source: {repository: primary, path: docker/agent-run-openclaw}
      artifactNamespace: ghcr.io/hazyforge/anvil-agent-run-openclaw
    - <<: *component
      name: pi-runner
      source: {repository: primary, path: docker/agent-run-pi}
      artifactNamespace: ghcr.io/hazyforge/anvil-agent-run-pi
  actionDefinitionRefs:
    - *build-action
  testContract:
    repository: primary
    path: .hazyforge/tests.yaml
  runtime:
    namespaces: [anvilhub]
