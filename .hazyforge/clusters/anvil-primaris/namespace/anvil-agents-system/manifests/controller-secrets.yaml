apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: anvil-agents-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv-cluster-secret-store
  target:
    name: ghcr-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"hazyforge","password":"{{ .pat }}","auth":"{{ printf "%s:%s" "hazyforge" .pat | b64enc }}"}}}'
  data:
    - secretKey: pat
      remoteRef:
        key: secret/anvil-primaris-ghcr-read-pat
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anvilhub-inventory-database
  namespace: anvil-agents-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv-cluster-secret-store
  target:
    name: anvilhub-inventory-database
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/anvilhub-inventory-database-url
    - secretKey: ca.crt
      remoteRef:
        key: secret/hazy-trade-postgres-ca-crt
