apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anvil-agents-oci-registry-write
  namespace: anvilhub
  labels:
    app.kubernetes.io/name: anvil-agents-delivery
    app.kubernetes.io/part-of: anvilhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv-cluster-secret-store
  target:
    name: anvil-agents-oci-registry-write
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          control.anvil.hazyforge.io/action-credential-class: oci-registry-write
        annotations:
          control.anvil.hazyforge.io/action-credential-env-map: '{"ANVIL_OCI_REGISTRY_PASSWORD":"password","ANVIL_OCI_REGISTRY_USERNAME":"username"}'
      data:
        username: PaleHazy
        password: '{{ .pat }}'
  data:
    - secretKey: pat
      remoteRef:
        key: secret/hazy-trade-ghcr-package-write-token
