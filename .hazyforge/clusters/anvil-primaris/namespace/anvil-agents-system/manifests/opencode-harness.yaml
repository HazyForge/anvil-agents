apiVersion: v1
kind: ServiceAccount
metadata:
  name: opencode-public-smoke
  namespace: anvil-agents-system
automountServiceAccountToken: false
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: opencode-public-smoke
  namespace: anvil-agents-system
spec:
  description: Credential-free, observe-only OpenCode lane for end-to-end harness and log-pipeline checks.
  backend:
    kind: openCode
    openCode:
      model: opencode/big-pickle
      format: json
      auto: false
      pure: true
  execution:
    serviceAccountName: opencode-public-smoke
    imagePullSecrets:
      - name: ghcr-creds
    extraEnv:
      - name: ANVIL_AGENT_RUN_AUTO_CLONE_REPO
        value: "false"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    workdir: /workspace
    timeoutSeconds: 300
    ttlSecondsAfterFinished: 86400
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentRunProfile
metadata:
  name: opencode-public-smoke
  namespace: anvil-agents-system
spec:
  description: Observe-only profile for proving the OpenCode harness and centralized log delivery.
  harnessProfileRef:
    name: opencode-public-smoke
  harness:
    intent: observe
    systemPrompt: >-
      This is a bounded harness smoke test. Do not mutate files, repositories,
      services, or cluster resources. Answer the requested task directly.
