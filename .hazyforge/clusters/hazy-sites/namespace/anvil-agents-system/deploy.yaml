helmChartPath: charts/anvil-agents

# Hazy Sites consumer deployment discovered by the cluster-local remote-helm
# ApplicationSet (path: .hazyforge/clusters/hazy-sites/namespace/**/deploy.yaml).
# One leader-elected controller; AgentRun Jobs schedule on the single-node pool.
replicaCount: 1
serviceAccount:
  name: anvil-agents
image:
  reference: ghcr.io/hazyforge/anvil-agents@sha256:de90d149478361f584c9ae23528c975cc50e511ab46559607dfa8caf41b07a8b
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: ghcr-creds
runnerImages:
  codex: ghcr.io/hazyforge/anvil-agent-run-codex@sha256:4138fa74fd4328b6f736ea6c97ed2b4a0ba31a6f48b3e989fdfbbba680fb6ab8
  openCode: ghcr.io/hazyforge/anvil-agent-run-opencode@sha256:479cac35c6cc9f8cc5c6591e3bddacb5245ebea8f16f3f590a449df9214b2dc9
  hermesAgent: ghcr.io/hazyforge/anvil-agent-run-hermes@sha256:fd90b3c59cd98e9bd20f820c1d5e8bd27da5e3217f035de3b590192ca1235358
  openClaw: ghcr.io/hazyforge/anvil-agent-run-openclaw@sha256:7bd2164cc2b21fd2c2f2f20342ff2f2b45c90add452532e64c68c8823a4efc7e
  grokBuild: ghcr.io/hazyforge/anvil-agent-run-grok-build@sha256:86b8d1a905c5e36af110fd880f2bb3db3efec5bc732bd16bff9ce8dc46f77f22
  piAgent: ghcr.io/hazyforge/anvil-agent-run-pi@sha256:1d41394c86d7c5ab66a7186d35097f9f1a6144cba7020e2410c1afdd3734e952
crds:
  install: true
leaderElection: true
applicationMaxConcurrentRuns: 2
defaultStorageClass: hcloud-volumes
externalSecrets:
  enabled: true
# Archive can be enabled later with a dedicated Postgres URI; keep install lean
# on the single-node sites pool until archive storage is provisioned.
archive:
  mode: disabled
# Console API stays off until a sites-scoped OIDC audience/bindings exist.
api:
  enabled: false
nodeSelector:
  kubernetes.io/arch: amd64
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
