apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-creds
  namespace: anvil-agents-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv-cluster-secret-store
  target:
    name: ghcr-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"hazyforge","password":"{{ .pat }}","auth":"{{ printf "%s:%s" "hazyforge" .pat | b64enc }}"}}}'
  data:
    - secretKey: pat
      remoteRef:
        key: secret/anvil-primaris-ghcr-read-pat
---
# Grok OAuth seed is operator-managed (not ExternalSecret) because the
# controller refuses ExternalSecret-backed AgentAuthSession bootstrap and the
# durable auth lives on AgentDataVolume hazy-sites-grok-home.
# Create once after install:
#   kubectl -n anvil-agents-system create secret generic hazy-sites-grok-auth-seed \
#     --from-file=GROK_AUTH_JSON=$HOME/.grok/auth.json \
#     --from-literal=GROK_AUTH_SEED_ID=hazy-sites-v1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-feedback-discord
  namespace: anvil-agents-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azurekv-cluster-secret-store
  target:
    name: agent-feedback-discord
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ANVIL_AGENT_FEEDBACK_DISCORD_BOT_TOKEN: "{{ .botToken }}"
        ANVIL_AGENT_FEEDBACK_DISCORD_CHANNEL_ID: "{{ .channelId }}"
        ANVIL_HOTLINE_DISCORD_BOT_TOKEN: "{{ .botToken }}"
        ANVIL_HOTLINE_DISCORD_CHANNEL_ID: "{{ .channelId }}"
        ANVIL_AGENT_FEEDBACK_ALLOWED_USER_IDS: "{{ .allowedUserIds }}"
        ANVIL_HOTLINE_ALLOWED_USER_IDS: "{{ .allowedUserIds }}"
  data:
    - secretKey: botToken
      remoteRef:
        key: secret/agent-feedback-discord-bot-token
    - secretKey: channelId
      remoteRef:
        key: secret/agent-feedback-discord-channel-id
    - secretKey: allowedUserIds
      remoteRef:
        key: secret/agent-feedback-discord-allowed-user-ids
