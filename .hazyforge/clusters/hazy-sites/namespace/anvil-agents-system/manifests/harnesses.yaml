apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: hazy-sites-grok45-site-healer
  namespace: anvil-agents-system
  labels:
    app.kubernetes.io/name: hazy-sites-site-healer
    app.kubernetes.io/part-of: hazy-sites-agents
    control.anvil.hazyforge.io/ownership: gitops
  annotations:
    ui.anvil.hazyforge.io/icon: /avatars/robot-03.jpg
    control.anvil.hazyforge.io/auth-data-volume: hazy-sites-grok-home
    control.anvil.hazyforge.io/auth-mode: oauth
    control.anvil.hazyforge.io/auth-provider: grokBuild
spec:
  description: Grok 4.5 runtime for bounded site recovery on the hazy-sites cluster.
  backend:
    kind: grokBuild
    modelProvider: xai
    providerAuthMode: oauth
    grokBuild:
      model: grok-4.5
      reasoningEffort: medium
  execution:
    serviceAccountName: hazy-sites-site-healer
    workdir: /workspace
    imagePullSecrets:
      - name: ghcr-creds
    dataVolumeRefs:
      - name: hazy-sites-grok-home
    envSecretRefs:
      - name: hazy-sites-grok-auth-seed
      - name: agent-feedback-discord
    externalSecretRefreshRefs:
      - name: agent-feedback-discord
        targetSecretRef:
          name: agent-feedback-discord
    extraEnv:
      - name: ANVIL_GROK_BUILD_CHECK
        value: "false"
      - name: ANVIL_AGENT_RUN_AUTO_CLONE_REPO
        value: "false"
      - name: HAZY_SITES_CLUSTER
        value: hazy-sites
      - name: HAZY_SITES_NAMESPACES
        value: hazyforge-landing,hazyforge-academy,code-kebab,depthlab,frostline,threshold,incantations-io,unoshirt-shop,debbiesfunart,glizzle-art,ombroso,gateway,cert-manager,monitoring,argocd
      - name: ANVIL_HOTLINE_TOOL
        value: anvil-hotline
      - name: ANVIL_AGENT_FEEDBACK_TOOL
        value: anvil-hotline
      - name: ANVIL_HOTLINE_TIMEOUT
        value: 30m
      - name: ANVIL_AGENT_FEEDBACK_TIMEOUT
        value: 30m
    resources:
      requests:
        cpu: 25m
        memory: 512Mi
        ephemeral-storage: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
        ephemeral-storage: 3Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
    timeoutSeconds: 1800
    ttlSecondsAfterFinished: 86400
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: hazy-sites-grok45-security-scanner
  namespace: anvil-agents-system
  labels:
    app.kubernetes.io/name: hazy-sites-security-scanner
    app.kubernetes.io/part-of: hazy-sites-agents
    control.anvil.hazyforge.io/ownership: gitops
  annotations:
    ui.anvil.hazyforge.io/icon: /avatars/robot-08.jpg
    control.anvil.hazyforge.io/auth-data-volume: hazy-sites-grok-home
    control.anvil.hazyforge.io/auth-mode: oauth
    control.anvil.hazyforge.io/auth-provider: grokBuild
spec:
  description: Grok 4.5 read-only security posture scanner for the hazy-sites cluster.
  backend:
    kind: grokBuild
    modelProvider: xai
    providerAuthMode: oauth
    grokBuild:
      model: grok-4.5
      reasoningEffort: medium
  execution:
    serviceAccountName: hazy-sites-security-scanner
    workdir: /workspace
    imagePullSecrets:
      - name: ghcr-creds
    dataVolumeRefs:
      - name: hazy-sites-grok-home
    envSecretRefs:
      - name: hazy-sites-grok-auth-seed
      - name: agent-feedback-discord
    externalSecretRefreshRefs:
      - name: agent-feedback-discord
        targetSecretRef:
          name: agent-feedback-discord
    extraEnv:
      - name: ANVIL_GROK_BUILD_CHECK
        value: "false"
      - name: ANVIL_AGENT_RUN_AUTO_CLONE_REPO
        value: "false"
      - name: HAZY_SITES_CLUSTER
        value: hazy-sites
      - name: HAZY_SITES_NAMESPACES
        value: hazyforge-landing,hazyforge-academy,code-kebab,depthlab,frostline,threshold,incantations-io,unoshirt-shop,debbiesfunart,glizzle-art,ombroso,gateway,cert-manager,monitoring,argocd,anvil-agents-system
      - name: ANVIL_HOTLINE_TOOL
        value: anvil-hotline
      - name: ANVIL_AGENT_FEEDBACK_TOOL
        value: anvil-hotline
      - name: ANVIL_HOTLINE_TIMEOUT
        value: 30m
      - name: ANVIL_AGENT_FEEDBACK_TIMEOUT
        value: 30m
    resources:
      requests:
        cpu: 25m
        memory: 512Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
        ephemeral-storage: 5Gi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      fsGroup: 10001
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      runAsNonRoot: true
    timeoutSeconds: 2700
    ttlSecondsAfterFinished: 86400
