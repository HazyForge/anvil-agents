apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: ArtifactBuild
metadata:
  name: anvil-agents-images
  namespace: anvilhub
spec:
  applicationRef:
    name: anvil-agents
  sources:
    - name: primary
      repositoryRef:
        name: hazyforge-anvil-agents
  componentRefs:
    - controller
    - codex-runner
    - grok-build-runner
    - hermes-runner
    - openclaw-runner
    - pi-runner
  actionPlan:
    nodes:
      - name: build-controller
        phase: BuildArtifact
        producesComponents: [controller]
        sourceRefs: [primary]
        invocation:
          actionRef: &build-action
            type: artifact.build
            version: v2
          executorSelector:
            agentRef:
              id: z400-artifact-worker
          credentialRefs: &registry-credential
            - name: anvil-agents-oci-registry-write
          inputs:
            workdir: /workspace/anvil-agents
            context: .
            dockerfile: Dockerfile
            component:
              name: controller
              location: ghcr.io/hazyforge/anvil-agents
              sourceRefs: [primary]
            buildkit:
              address: tcp://z400-buildkit.anvil-builders.svc.cluster.local:1234
            platform: linux/amd64
      - name: build-codex-runner
        phase: BuildArtifact
        producesComponents: [codex-runner]
        sourceRefs: [primary]
        invocation:
          actionRef: *build-action
          executorSelector:
            agentRef:
              id: acer-artifact-worker
          credentialRefs: *registry-credential
          inputs:
            workdir: /workspace/anvil-agents
            context: .
            dockerfile: docker/agent-run-codex/Dockerfile
            component:
              name: codex-runner
              location: ghcr.io/hazyforge/anvil-agent-run-codex
              sourceRefs: [primary]
            buildkit:
              address: tcp://acer-buildkit.anvil-builders.svc.cluster.local:1234
            platform: linux/amd64
      - name: build-grok-build-runner
        phase: BuildArtifact
        producesComponents: [grok-build-runner]
        sourceRefs: [primary]
        invocation:
          actionRef: *build-action
          executorSelector:
            agentRef:
              id: z400-artifact-worker
          credentialRefs: *registry-credential
          inputs:
            workdir: /workspace/anvil-agents
            context: .
            dockerfile: docker/agent-run-grok-build/Dockerfile
            component:
              name: grok-build-runner
              location: ghcr.io/hazyforge/anvil-agent-run-grok-build
              sourceRefs: [primary]
            buildkit:
              address: tcp://z400-buildkit.anvil-builders.svc.cluster.local:1234
            platform: linux/amd64
      - name: build-hermes-runner
        phase: BuildArtifact
        producesComponents: [hermes-runner]
        sourceRefs: [primary]
        invocation:
          actionRef: *build-action
          executorSelector:
            agentRef:
              id: acer-artifact-worker
          credentialRefs: *registry-credential
          inputs:
            workdir: /workspace/anvil-agents
            context: .
            dockerfile: docker/agent-run-hermes/Dockerfile
            component:
              name: hermes-runner
              location: ghcr.io/hazyforge/anvil-agent-run-hermes
              sourceRefs: [primary]
            buildkit:
              address: tcp://acer-buildkit.anvil-builders.svc.cluster.local:1234
            platform: linux/amd64
      - name: build-openclaw-runner
        phase: BuildArtifact
        producesComponents: [openclaw-runner]
        sourceRefs: [primary]
        invocation:
          actionRef: *build-action
          executorSelector:
            agentRef:
              id: z400-artifact-worker
          credentialRefs: *registry-credential
          inputs:
            workdir: /workspace/anvil-agents
            context: .
            dockerfile: docker/agent-run-openclaw/Dockerfile
            component:
              name: openclaw-runner
              location: ghcr.io/hazyforge/anvil-agent-run-openclaw
              sourceRefs: [primary]
            buildkit:
              address: tcp://z400-buildkit.anvil-builders.svc.cluster.local:1234
            platform: linux/amd64
      - name: build-pi-runner
        phase: BuildArtifact
        producesComponents: [pi-runner]
        sourceRefs: [primary]
        invocation:
          actionRef: *build-action
          executorSelector:
            agentRef:
              id: acer-artifact-worker
          credentialRefs: *registry-credential
          inputs:
            workdir: /workspace/anvil-agents
            context: .
            dockerfile: docker/agent-run-pi/Dockerfile
            component:
              name: pi-runner
              location: ghcr.io/hazyforge/anvil-agent-run-pi
              sourceRefs: [primary]
            buildkit:
              address: tcp://acer-buildkit.anvil-builders.svc.cluster.local:1234
            platform: linux/amd64
