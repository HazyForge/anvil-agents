apiVersion: anvil.hazyforge.io/tests/v1alpha1
kind: TestContract
metadata:
  name: anvil-agents
  namespace: anvilhub
  application: anvil-agents
  labels:
    app.kubernetes.io/name: anvil-agents
gates:
  release:
    suites: [standalone-operator]
profiles:
  anvil-agents:
    namespace: anvilhub
    workdir: /workspace/anvil-agents
    repository:
      path: /workspace/anvil-agents
    agentRefs:
      - id: z400-build-worker
      - id: acer-build-worker
suites:
  standalone-operator:
    profile: anvil-agents
    timeoutSeconds: 3600
    coverage:
      components:
        - controller
        - codex-runner
        - opencode-runner
        - grok-build-runner
        - hermes-runner
        - openclaw-runner
        - pi-runner
      sources: [primary]
    lanes:
      - name: verify
        adapter: shell
        script: |
          make verify
      - name: runner-dockerfiles
        adapter: shell
        script: |
          for dockerfile in docker/agent-run-*/Dockerfile; do
            docker build --check -f "$dockerfile" .
          done
