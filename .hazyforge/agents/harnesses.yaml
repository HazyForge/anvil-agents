apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: anvil-agents-grok45-reader
spec:
  description: Stateless Grok 4.5 runtime with no repository write credential.
  backend:
    kind: grokBuild
    modelProvider: xai
    providerAuthMode: apiKey
    grokBuild:
      model: grok-4.5
  execution:
    nodeSelector:
      hazyforge.io/home-lab: "true"
    serviceAccountName: anvil-agents-self-development-reader
    workdir: /workspace
    envSecretRefs:
      - name: anvil-agents-grok-xai
    extraEnv:
      - name: ANVIL_AGENT_RUN_REPOSITORY
        value: HazyForge/anvil-agents
      - name: ANVIL_AGENT_RUN_REPOSITORY_URL
        value: https://github.com/HazyForge/anvil-agents.git
      - name: KNOWLEDGE_BASE_URL
        value: http://knowledge-base.knowledge-base.svc.cluster.local:8080
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    timeoutSeconds: 1800
    ttlSecondsAfterFinished: 86400
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: anvil-agents-grok45-pr-writer
spec:
  description: Approval-gated Grok 4.5 runtime with repository-scoped PR credentials.
  backend:
    kind: grokBuild
    modelProvider: xai
    providerAuthMode: apiKey
    grokBuild:
      model: grok-4.5
  execution:
    nodeSelector:
      hazyforge.io/home-lab: "true"
    serviceAccountName: anvil-agents-self-development-writer
    workdir: /workspace
    envSecretRefs:
      - name: anvil-agents-grok-xai
      - name: anvil-agents-github-pr-writer
    extraEnv:
      - name: ANVIL_AGENT_RUN_REPOSITORY
        value: HazyForge/anvil-agents
      - name: ANVIL_AGENT_RUN_REPOSITORY_URL
        value: https://github.com/HazyForge/anvil-agents.git
      - name: KNOWLEDGE_BASE_URL
        value: http://knowledge-base.knowledge-base.svc.cluster.local:8080
    resources:
      requests:
        cpu: 750m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 3Gi
    timeoutSeconds: 2700
    ttlSecondsAfterFinished: 86400
