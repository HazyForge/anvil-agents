apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentSkillSet
metadata:
  name: anvil-agents-self-development
spec:
  description: Evidence-first, knowledge-aware maintenance of anvil-agents.
  skills:
    - name: repository-self-development
      description: Improve this repository through bounded, reviewable work.
      content: |
        Treat the checked-out anvil-agents repository as the only product in
        scope. Read AGENTS.md and current repository evidence before proposing
        work. Query organizational knowledge before deciding, cite returned
        note paths, and distinguish durable policy from stale notes.

        Observe roles must not modify Git, GitHub, Kubernetes, the knowledge
        service, or any external system. A proposeChange role may create one
        focused branch and pull request only when its one-off AgentRun names an
        approved issue and exact base commit. It must never merge, release,
        alter cluster policy, or push master. Every proposed code change must
        run the narrowest relevant tests and make a clean handoff for an
        independent reviewer.
    - name: external-knowledge-read-policy
      description: Use the cluster knowledge service only for bounded reads.
      content: |
        Run `.anvil-tools/knowledge-search QUERY` before selecting an
        improvement. The wrapper exposes only search-index, but that is a
        client-side convention, not server authorization. Never call the
        service directly, never send source code or secrets, and never invoke
        a write operation. If search is unavailable, report that explicitly.
  subagents:
    - name: api-compatibility-reviewer
      when: A change affects CRDs, generated manifests, or stored objects.
      toolNames: [knowledge-search]
      systemPrompt: Preserve the documented v1alpha1 wire identity and check generated API artifacts.
    - name: test-contract-reviewer
      when: A change affects controller, runner, chart, or upgrade behavior.
      toolNames: [knowledge-search]
      systemPrompt: Challenge the proposed test coverage and identify unverified release boundaries.
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentToolSet
metadata:
  name: anvil-agents-cluster-knowledge
spec:
  description: Read-only client wrapper for the separately deployed knowledge-based service.
  tools:
    - name: knowledge-search
      description: Search the external Hazy Forge Markdown knowledge index.
      setupScript: |
        command -v curl >/dev/null
        command -v jq >/dev/null
        mkdir -p .anvil-tools
        cat > .anvil-tools/knowledge-search <<'SCRIPT'
        #!/usr/bin/env sh
        set -eu
        if [ "${1:-}" = "--help" ]; then
          echo "usage: knowledge-search QUERY"
          exit 0
        fi
        call_id="${ANVIL_AGENT_RUN:-unknown}-knowledge-search-$$"
        if [ -z "${KNOWLEDGE_BASE_URL:-}" ]; then
          printf 'ANVIL_AGENT_RUN_TOOL_CALL_FAILED name=knowledge-search call_id=%s reason=missing-url\n' \
            "$call_id" >&2
          exit 2
        fi
        query="$*"
        case "$query" in
          *[![:space:]]*) ;;
          *)
            printf 'ANVIL_AGENT_RUN_TOOL_CALL_FAILED name=knowledge-search call_id=%s reason=empty-query\n' \
              "$call_id" >&2
            exit 2
            ;;
        esac
        payload="$(jq -nc --arg query "$query" \
          '{operation:"search-index",params:{query:$query,limit:10}}')"
        set -- --silent --show-error \
          --request POST \
          --header "Content-Type: application/json" \
          --header "Accept: application/json"
        if [ -n "${KNOWLEDGE_BASE_TOKEN:-}" ]; then
          set -- "$@" --header "Authorization: Bearer ${KNOWLEDGE_BASE_TOKEN}"
        fi
        printf 'ANVIL_AGENT_RUN_TOOL_CALL_START name=knowledge-search call_id=%s\n' \
          "$call_id" >&2
        if response="$(curl "$@" --data "$payload" \
          "${KNOWLEDGE_BASE_URL%/}/v1/operations")"; then
          :
        else
          status="$?"
          printf 'ANVIL_AGENT_RUN_TOOL_CALL_FAILED name=knowledge-search call_id=%s exit_code=%s\n' \
            "$call_id" "$status" >&2
          exit "$status"
        fi
        if ! printf %s "$response" | jq -e '.ok == true' >/dev/null 2>&1; then
          failure_reason="operation-rejected"
          if printf %s "$response" | jq -e \
            '(.error // "") | contains(".knowledge-based/search-index")' \
            >/dev/null 2>&1; then
            failure_reason="index-unavailable"
          fi
          printf 'ANVIL_AGENT_RUN_TOOL_CALL_FAILED name=knowledge-search call_id=%s reason=%s\n' \
            "$call_id" "$failure_reason" >&2
          exit 1
        fi
        response_bytes="$(printf %s "$response" | wc -c | tr -d ' ')"
        printf 'ANVIL_AGENT_RUN_TOOL_CALL_OK name=knowledge-search call_id=%s operation=search-index response_bytes=%s\n' \
          "$call_id" "$response_bytes" >&2
        printf '%s\n' "$response"
        SCRIPT
        chmod 0700 .anvil-tools/knowledge-search
      verifyCommand: [".anvil-tools/knowledge-search", "--help"]
