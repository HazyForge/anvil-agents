replicaCount: 1

image:
  reference: ""
  repository: anvil-agents
  tag: dev
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

leaderElection: true
watchNamespaces: ""
applicationMaxConcurrentRuns: 1
defaultStorageClass: ""

# These defaults apply only when an AgentRun/Profile omits backend.image.
# Production installs should pin immutable digests or use a private mirror.
runnerImages:
  codex: anvil-agent-run-codex:dev
  openCode: anvil-agent-run-opencode:dev
  hermesAgent: anvil-agent-run-hermes:dev
  openClaw: anvil-agent-run-openclaw:dev
  grokBuild: anvil-agent-run-grok-build:dev
  piAgent: anvil-agent-run-pi:dev
  agy: anvil-agent-run-agy:dev
  primeAgent: anvil-agent-run-prime:dev

platformContext:
  repository: HazyForge/anvil-agents
  repositoryURL: https://github.com/HazyForge/anvil-agents.git
  docs:
    - docs/agent-run.md
    - internal/controller/prompts/agent-run-system.md
    - internal/controller/agent_run_controller.go

adverseSourceGVKs: []
# Structured pull integrations. Each entry binds one exact Kubernetes resource
# to a classifier and destination AdverseSituation. The chart derives read-only
# RBAC from apiVersion/resource; no wildcard permissions are added.
adverseSources: []
githubAPI:
  allowedHosts:
    - api.github.com
  allowInsecure: false
# Grants mutation access to external-secrets.io ExternalSecrets for the
# optional execution.externalSecretRefreshRefs freshness preflight.
externalSecrets:
  enabled: false
extraRBACRules: []
extraEnv: []
envFrom: []
extraVolumes: []
extraVolumeMounts: []

crds:
  install: true

archive:
  # disabled | external | standalone | cloudnativepg
  # Empty preserves legacy databaseURLSecret auto-detection and otherwise
  # resolves to disabled. New installations should set a mode explicitly.
  mode: ""
  # Change after rotating an externally managed database Secret to restart the
  # controller and recreate its cached PostgreSQL connection pool.
  restartToken: ""
  terminalRetention: ""

  # Deprecated compatibility alias. A non-empty name selects external mode
  # when mode is left at its default. Prefer external.databaseURLSecret.
  databaseURLSecret:
    name: ""
    key: url

  external:
    databaseURLSecret:
      name: ""
      key: url

  # A single PostgreSQL StatefulSet for development and small installations.
  # For GitOps/Argo CD, set auth.existingSecret because Helm's generated
  # credential is intentionally not deterministic during offline rendering.
  standalone:
    image:
      reference: ""
      repository: postgres
      tag: 17-alpine
      pullPolicy: IfNotPresent
    database: anvil_agents
    username: anvil_agents
    port: 5432
    auth:
      # When set, this Secret must contain both passwordKey and databaseURLKey.
      existingSecret: ""
      # Explicit opt-in for live Helm installs only. Keep false for GitOps.
      generate: false
      passwordKey: password
      databaseURLKey: url
    storage:
      size: 10Gi
      storageClass: ""
      accessModes:
        - ReadWriteOnce
    resources: {}
    # These IDs match the default postgres:alpine image. Adjust them together
    # when overriding the image with one that uses a different postgres UID.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 70
      runAsGroup: 70
      fsGroup: 70
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    nodeSelector: {}
    tolerations: []
    affinity: {}

  # Creates a Cluster only when the CloudNativePG operator and Cluster CRD are
  # already installed. The operator must generate an app Secret with key uri
  # (documented by CloudNativePG 1.19+). The chart never installs CNPG itself.
  cloudnativePG:
    clusterName: ""
    instances: 1
    database: anvil_agents
    owner: anvil_agents
    dataChecksums: true
    storage:
      size: 10Gi
      storageClass: ""
    resources: {}

service:
  metricsPort: 8080

# The read-only AgentRun API is a separate workload and security boundary from
# the controller. It is disabled until an issuer, audience, and explicit
# authorization bindings are configured.
api:
  # API-only process environment; independent of controller extraEnv.
  extraEnv: []
  image:
    # Optional complete API image reference for independent API rollouts.
    # Empty inherits image.reference, or image.repository:image.tag when unset.
    # The controller continues to use the top-level image configuration.
    reference: ""
  # Optional API-only mounts, including CA certificates referenced by the chat database URL.
  extraVolumes: []
  extraVolumeMounts: []
  # Optional init containers (e.g. copy a standing ProcessBackend CLI such as
  # grok into an emptyDir mounted on PATH). Empty by default. See
  # docs/standing-inprocess-harness.md Primaris section.
  initContainers: []
  enabled: false
  replicaCount: 1
  serviceAccount:
    create: true
    name: ""
  service:
    port: 8082
  config:
    bindAddress: ":8082"
    oidc:
      issuer: ""
      audiences: []
      allowedSigningAlgorithms:
        - RS256
        - ES256
      additionalJWKSHosts: []
      caFile: ""
      allowInsecureIssuer: false
      discoveryRetryInterval: 5s
      discoveryRefreshInterval: 1h
      discoveryRequestTimeout: 10s
    authorization:
      scopeClaims:
        - scope
        - scp
      roleClaims:
        - roles
      roleObjectClaims: []
      groupClaims:
        - groups
      namespaceClaim: anvil_agents_namespaces
      bindings: []
    cors:
      allowedOrigins: []
    ui:
      productTitle: Anvil Agents Console
      defaultNamespaces: []
      # Public SPA OIDC client id (Authorization Code + PKCE, no secret).
      oidc:
        clientId: ""
        scopes: []
      # Public Native PKCE client id for Anvil Agents Desktop. Empty omits
      # desktop.oidcClientId from ui-config.json so Desktop warns instead of
      # silently using the Console User-Agent client. GitOps sets the Zitadel
      # Native app id after identity tofu assigns it. Do not copy the Console
      # clientId here.
      desktop:
        oidcClientId: ""
    # Composition library (profiles, skill/tool sets, volumes, harness).
    # GitOps-owned objects remain read-only even when writeEnabled is true;
    # only console-managed objects (label managed-by=anvil-agents-console)
    # can be created/updated/deleted through the API.
    composition:
      readEnabled: false
      writeEnabled: false
    # Append-only AgentRun create for console agent cards.
    runs:
      createEnabled: false
    # Inbound GitHub webhook receivers (AgentExternalTrigger). Disabled by
    # default. When enabled, the API may read same-namespace Secret values only
    # to verify HMAC signatures; Secret bytes never appear in status or API JSON.
    externalTriggers:
      enabled: false
    # Standing-chat threads/messages in PostgreSQL. Disabled until explicitly
    # enabled. The URI is never a chart/ConfigMap value; the API Pod reads
    # ANVIL_AGENTS_CHAT_DATABASE_URL from a Secret (archive Secret by default).
    chat:
      enabled: false
      # Jev intent routing on the chat-append path. Disabled by default. When
      # true the API classifies each incoming message (Router.ClassifyIntent)
      # before freezing the turn prompt and folds a per-intent routing hint
      # into the prompt plus intent metadata. Jev only decides; it never
      # generates chat text, needs no RBAC change and no Secret access (the
      # live backend reads TYPESAFE_API_KEY from process env, e.g. via
      # api.extraEnv). Without a backend attached every turn falls back to
      # today's behavior. See docs/jev-intent-routing.md.
      jevIntentEnabled: false
      # Optional Jev serving-model pin for chat-turn intent classification
      # (Router.ClassifyIntent). Empty (the default) tracks the jev-latest
      # alias via jev.DefaultModel. Set a versioned ID once thresholds are
      # tuned against one version — jev-1.13.0 is the validated serving
      # model from the live Kind-local e2e (see docs/jev-intent-routing.md).
      # Overridable per-process with ANVIL_AGENTS_JEV_MODEL when non-empty.
      # Jev only decides; it never generates chat text.
      jevModel: ""
    # Standing in-process live turns (slice 5c). Disabled by default. When
    # true, the API drives API-owned standing turns: it stamps the
    # multi-replica claim (update/patch agentruns) and marks the streamed
    # turn Succeeded (update agentruns/status). The chart grants exactly
    # that RBAC and nothing else — no Secret access. Without it the slice-4
    # claim degrades to hold behavior. See docs/standing-inprocess-harness.md.
    standing:
      liveEnabled: false
    # Cluster-scoped AgentRunControl launch gates (pause/resume from the console).
    # GitOps-owned controls remain read-only; operator-created controls are
    # writable when writeEnabled is true.
    controls:
      readEnabled: false
      writeEnabled: false
    list:
      maxItems: 5000
    stream:
      heartbeatInterval: 15s
      statusPollInterval: 2s
      maxDuration: 15m
      defaultTailLines: 200
      maxTailLines: 10000
      maxLogBytes: 4194304
      maxLineBytes: 1048576
      maxConnections: 50
      maxConnectionsPerSubject: 5
  httpRoute:
    enabled: false
    annotations: {}
    parentRefs: []
    hostnames: []
  # Controller-owned Gateway API HTTPRoute per AgentExternalTrigger webhook.
  # When enabled (or when api.httpRoute.enabled and externalTriggers are on),
  # empty parentRefs/hostnames inherit api.httpRoute. Never uses wildcards.
  # Routes are created in the controller/API install namespace (this release
  # namespace) so Gateway listener allowlists do not have to include every
  # agent namespace. The chart does not create Gateway objects.
  externalTriggerHTTPRoute:
    enabled: false
    # Namespace for webhook HTTPRoutes. Empty uses the Helm release namespace
    # (the controller/API install namespace). Do not put routes next to the
    # trigger unless that namespace is already allowed by the Gateway listener.
    namespace: ""
    parentRefs: []
    hostnames: []
    # Unused when routes live in the install namespace (the default). Kept so
    # existing values files remain valid.
    backendFromNamespaces: []
  # Optional Secret override for standing-chat PostgreSQL URI. Empty name
  # reuses the archive Secret resolved from archive.mode when chat is enabled.
  chatDatabaseURLSecret:
    name: ""
    key: url
  oidcCA:
    configMapName: ""
    key: ca.crt
    # Change after rotating an externally managed CA ConfigMap to restart pods.
    restartToken: ""
  resources: {}
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  nodeSelector: {}
  tolerations: []
  affinity: {}

resources: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
nodeSelector: {}
tolerations: []
affinity: {}

# Optional live ATE actor plane (agent-substrate/substrate). Off by default.
# Standing ProcessBackend already completes SubstrateActor chat turns without
# this gate and is the Primaris speed path. Enabling the gate without a
# reachable ateapi, or enabling bind-only ATE without a completion path,
# leaves unclaimed SubstrateActor runs Running/SubstrateActorBound.
# Do not put bearer tokens or CA PEM bytes here; prefer a mounted token file
# or the controller's short-lived ate-client ServiceAccount token, and a
# mounted or looked-up ateapi-ca ConfigMap (ATE Helm 0.0.8 jwt mode).
# --substrate-insecure stays loopback-only even if set.
substrate:
  actorsEnabled: false
  endpoint: ""
  template: ""
  atespace: ""
  tokenFile: ""
  insecure: false
  # In-pod path to the jwt CA PEM. Set automatically when ca.configMapName
  # is in the release namespace. Cross-namespace lookup uses ca.* instead.
  caFile: ""
  # TLS ServerName override (empty = api.ate-system.svc).
  tlsServerName: ""
  ca:
    # ATE jwt ConfigMap name (chart default ateapi-ca). Empty disables CA
    # wiring. Same-namespace ConfigMaps are mounted; other namespaces are
    # read through the Kubernetes API (controller ConfigMap get). Never
    # put CA bytes in status, logs, or console/API JSON.
    configMapName: ""
    namespace: ""
    key: ca.crt
  token:
    # Project a ServiceAccount token with the ateapi JWT audience. Off by
    # default. Token bytes never land in status, logs, or console JSON.
    projected: false
    audience: api.ate-system.svc
    expirationSeconds: 3600
    mountPath: /var/run/secrets/tokens/ate-api

# Additional explicit Kubernetes objects installed and owned by this Helm
# release. Set metadata.namespace on every namespaced object. Values are not
# evaluated as Go templates. Keep credentials in external Secret references.
extraObjects: []
