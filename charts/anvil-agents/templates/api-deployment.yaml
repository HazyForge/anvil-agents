{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvil-agents.apiFullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        {{ with .Values.api.oidcCA.restartToken }}
        control.anvil.hazyforge.io/oidc-ca-restart: {{ . | quote }}
        {{ end }}
    spec:
      serviceAccountName: {{ include "anvil-agents.apiServiceAccountName" . }}
      securityContext:
{{ toYaml .Values.api.podSecurityContext | indent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/anvil-agents-api
          args:
            - --config=/etc/anvil-agents-api/config.yaml
          ports:
            - name: api
              containerPort: {{ .Values.api.service.port }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
          readinessProbe:
            httpGet:
              path: /readyz
              port: api
          securityContext:
{{ toYaml .Values.api.securityContext | indent 12 }}
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anvil-agents-api
              readOnly: true
            {{- with .Values.api.oidcCA.configMapName }}
            - name: oidc-ca
              mountPath: /etc/anvil-agents-api/oidc-ca
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anvil-agents.apiFullname" . }}
        {{- with .Values.api.oidcCA.configMapName }}
        - name: oidc-ca
          configMap:
            name: {{ . }}
            items:
              - key: {{ $.Values.api.oidcCA.key }}
                path: ca.crt
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
{{- end }}
