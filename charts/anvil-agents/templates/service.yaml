apiVersion: v1
kind: Service
metadata:
  name: {{ include "anvil-agents.fullname" . }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "anvil-agents.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
