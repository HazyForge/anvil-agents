apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "anvil-agents.fullname" . }}
rules:
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["adversesituations", "agentauthsessions", "agentchains", "agentdatavolumes", "agentdatavolumecopies", "agentruncontrols", "agentruns", "agentschedules"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentcouncils", "agentharnessprofiles", "agentrunprofiles", "agentskillsets", "agenttoolsets", "volumeprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["adversesituations/status", "adversesignals/status", "agentauthsessions/status", "agentchains/status", "agentdatavolumes/status", "agentdatavolumecopies/status", "agentruncontrols/status", "agentruns/status", "agentschedules/status", "volumeprofiles/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["adversesignals"]
    verbs: ["get", "list", "patch", "watch"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["adversesignals/finalizers", "adversesituations/finalizers", "agentauthsessions/finalizers", "agentchains/finalizers", "agentdatavolumes/finalizers", "agentdatavolumecopies/finalizers", "agentruns/finalizers", "agentschedules/finalizers"]
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods", "persistentvolumeclaims", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  {{- if .Values.externalSecrets.enabled }}
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch", "update"]
  {{- end }}
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
{{- range .Values.adverseSources }}
  - apiGroups: [{{ if contains "/" .apiVersion }}{{ (splitList "/" .apiVersion | first) | quote }}{{ else }}""{{ end }}]
    resources: [{{ required "adverseSources[].resource is required for exact RBAC" .resource | quote }}]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- with .Values.extraRBACRules }}
{{ toYaml . | indent 2 }}
{{- end }}
