{{- if .Values.api.enabled }}
{{- $apiServiceAccount := include "anvil-agents.apiServiceAccountName" . -}}
{{- $controllerServiceAccount := include "anvil-agents.serviceAccountName" . -}}
{{- if eq $apiServiceAccount $controllerServiceAccount -}}
{{- fail "api.serviceAccount must resolve to a different ServiceAccount than the controller serviceAccount" -}}
{{- end -}}
{{- if .Values.api.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $apiServiceAccount }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
{{- end }}
