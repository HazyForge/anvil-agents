{{- if and (eq (include "anvil-agents.archiveMode" .) "standalone") .Values.archive.standalone.auth.generate }}
{{- $name := include "anvil-agents.archiveStandaloneName" . -}}
{{- $passwordKey := .Values.archive.standalone.auth.passwordKey -}}
{{- $databaseURLKey := .Values.archive.standalone.auth.databaseURLKey -}}
{{- $password := randAlphaNum 48 -}}
{{- $databaseURL := printf "postgresql://%s:%s@%s:%v/%s?sslmode=disable" .Values.archive.standalone.username $password $name .Values.archive.standalone.port .Values.archive.standalone.database -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if $existing -}}
  {{- if not (hasKey $existing.data $passwordKey) -}}
    {{- fail (printf "retained standalone archive Secret %s is missing key %s" $name $passwordKey) -}}
  {{- end -}}
  {{- if not (hasKey $existing.data $databaseURLKey) -}}
    {{- fail (printf "retained standalone archive Secret %s is missing key %s" $name $databaseURLKey) -}}
  {{- end -}}
  {{- $password = (index $existing.data $passwordKey | b64dec) -}}
  {{- $databaseURL = printf "postgresql://%s:%s@%s:%v/%s?sslmode=disable" .Values.archive.standalone.username $password $name .Values.archive.standalone.port .Values.archive.standalone.database -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: archive-postgres
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
type: Opaque
data:
  {{ $passwordKey | quote }}: {{ $password | b64enc | quote }}
  {{ $databaseURLKey | quote }}: {{ $databaseURL | b64enc | quote }}
{{- end }}
