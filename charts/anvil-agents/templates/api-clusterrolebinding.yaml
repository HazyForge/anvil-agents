{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "anvil-agents.apiFullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "anvil-agents.apiFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "anvil-agents.apiServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
