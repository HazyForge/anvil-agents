{{- if .Values.api.enabled }}
{{- $compositionRead := dig "composition" "readEnabled" false .Values.api.config }}
{{- $compositionWrite := dig "composition" "writeEnabled" false .Values.api.config }}
{{- $runsCreate := dig "runs" "createEnabled" false .Values.api.config }}
{{- $controlsRead := dig "controls" "readEnabled" false .Values.api.config }}
{{- $controlsWrite := dig "controls" "writeEnabled" false .Values.api.config }}
{{- $externalTriggers := dig "externalTriggers" "enabled" false .Values.api.config }}
{{- if and $compositionWrite (not $compositionRead) }}
{{- fail "api.config.composition.writeEnabled requires api.config.composition.readEnabled" }}
{{- end }}
{{- if and $controlsWrite (not $controlsRead) }}
{{- fail "api.config.controls.writeEnabled requires api.config.controls.readEnabled" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "anvil-agents.apiFullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentruns"]
    verbs:
      - get
      - list
{{- if or $runsCreate $externalTriggers }}
      - create
{{- end }}
{{- if $externalTriggers }}
      - patch
      - update
{{- end }}
{{- if $compositionRead }}
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources:
      - agentrunprofiles
      - agentharnessprofiles
      - agentskillsets
      - agenttoolsets
      - agentcouncils
      - volumeprofiles
      - agentdatavolumes
      # Append-only auth maintenance CRs: read for console cards; mutate via anvil-agentctl only.
      - agentauthsessions
{{- if $externalTriggers }}
      - agentexternaltriggers
{{- end }}
    verbs:
      - get
      - list
{{- if $compositionWrite }}
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources:
      - agentrunprofiles
      - agentharnessprofiles
      - agentskillsets
      - agenttoolsets
      - agentcouncils
      - volumeprofiles
      - agentdatavolumes
{{- if $externalTriggers }}
      - agentexternaltriggers
{{- end }}
    verbs:
      - create
      - update
      - patch
      - delete
{{- end }}
{{- end }}
{{- if and $externalTriggers (not $compositionRead) }}
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentexternaltriggers"]
    verbs:
      - get
      - list
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentrunprofiles", "agentcouncils"]
    verbs:
      - get
      - list
{{- end }}
{{- if $externalTriggers }}
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentexternaltriggers/status"]
    verbs:
      - get
      - patch
      - update
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- end }}
{{- if $controlsRead }}
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentruncontrols"]
    verbs:
      - get
      - list
{{- if $controlsWrite }}
      - update
      - patch
{{- end }}
{{- end }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
{{- end }}