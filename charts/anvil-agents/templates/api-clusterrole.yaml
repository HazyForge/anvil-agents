{{- if .Values.api.enabled }}
{{- $compositionRead := dig "composition" "readEnabled" false .Values.api.config }}
{{- $compositionWrite := dig "composition" "writeEnabled" false .Values.api.config }}
{{- if and $compositionWrite (not $compositionRead) }}
{{- fail "api.config.composition.writeEnabled requires api.config.composition.readEnabled" }}
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "anvil-agents.apiFullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.apiName" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentruns"]
    verbs: ["get", "list"]
{{- if $compositionRead }}
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources:
      - agentrunprofiles
      - agentharnessprofiles
      - agentskillsets
      - agenttoolsets
      - volumeprofiles
      - agentdatavolumes
    verbs:
      - get
      - list
{{- if $compositionWrite }}
      - create
      - update
      - patch
      - delete
{{- end }}
{{- end }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
{{- end }}
