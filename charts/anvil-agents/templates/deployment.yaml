{{- include "anvil-agents.validateArchive" . }}
{{- include "anvil-agents.validateExternalTriggerHTTPRoute" . }}
{{- include "anvil-agents.validateChat" . }}
{{- include "anvil-agents.validateSubstrate" . }}
{{- $archiveMode := include "anvil-agents.archiveMode" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anvil-agents.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "anvil-agents.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "anvil-agents.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "anvil-agents.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.archive.restartToken }}
      annotations:
        control.anvil.hazyforge.io/archive-restart: {{ . | quote }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "anvil-agents.serviceAccountName" . }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) .Values.image.reference | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.leaderElection }}
            - --watch-namespaces={{ .Values.watchNamespaces }}
            - --application-max-concurrent-runs={{ .Values.applicationMaxConcurrentRuns }}
            - --default-storage-class={{ .Values.defaultStorageClass }}
            - --platform-repository={{ .Values.platformContext.repository }}
            - --platform-repository-url={{ .Values.platformContext.repositoryURL }}
            - --platform-docs={{ join "," .Values.platformContext.docs }}
            - --adverse-source-gvks={{ join "," .Values.adverseSourceGVKs }}
            {{- with .Values.adverseSources }}
            - {{ printf "--adverse-sources-json=%s" (toJson .) | quote }}
            {{- end }}
            - --github-api-allowed-hosts={{ join "," .Values.githubAPI.allowedHosts }}
            - --allow-insecure-github-api={{ .Values.githubAPI.allowInsecure }}
            - --runner-image-codex={{ .Values.runnerImages.codex }}
            - --runner-image-opencode={{ .Values.runnerImages.openCode }}
            - --runner-image-hermes-agent={{ .Values.runnerImages.hermesAgent }}
            - --runner-image-openclaw={{ .Values.runnerImages.openClaw }}
            - --runner-image-grok-build={{ .Values.runnerImages.grokBuild }}
            - --runner-image-pi-agent={{ .Values.runnerImages.piAgent }}
            - --runner-image-agy={{ .Values.runnerImages.agy }}
            - --runner-image-prime-agent={{ .Values.runnerImages.primeAgent }}
            {{- if eq (include "anvil-agents.externalTriggerHTTPRouteEnabled" . | trim) "true" }}
            - --external-triggers-enabled=true
            - --external-trigger-httproute-enabled=true
            - {{ printf "--external-trigger-httproute-json=%s" (include "anvil-agents.externalTriggerHTTPRouteConfig" .) | quote }}
            {{- end }}
            {{- with .Values.archive.terminalRetention }}
            - --terminal-retention={{ . }}
            {{- end }}
            {{- if .Values.substrate.actorsEnabled }}
            - --substrate-actors-enabled=true
            {{- end }}
            {{- with .Values.substrate.endpoint }}
            - --substrate-endpoint={{ . }}
            {{- end }}
            {{- with .Values.substrate.template }}
            - --substrate-template={{ . }}
            {{- end }}
            {{- with .Values.substrate.atespace }}
            - --substrate-atespace={{ . }}
            {{- end }}
            {{- $tokenFile := .Values.substrate.tokenFile }}
            {{- if and .Values.substrate.token .Values.substrate.token.projected }}
            {{- $tokenFile = default (printf "%s/token" (default "/var/run/secrets/tokens/ate-api" .Values.substrate.token.mountPath)) $tokenFile }}
            {{- end }}
            {{- with $tokenFile }}
            - --substrate-token-file={{ . }}
            {{- end }}
            {{- if .Values.substrate.insecure }}
            - --substrate-insecure=true
            {{- end }}
            {{- $caName := "" }}
            {{- $caNS := "" }}
            {{- $caKey := "ca.crt" }}
            {{- if .Values.substrate.ca }}
            {{- $caName = default "" .Values.substrate.ca.configMapName }}
            {{- $caNS = default "" .Values.substrate.ca.namespace }}
            {{- $caKey = default "ca.crt" .Values.substrate.ca.key }}
            {{- end }}
            {{- $caSameNS := or (eq $caNS "") (eq $caNS .Release.Namespace) }}
            {{- $caFile := .Values.substrate.caFile }}
            {{- if and $caName $caSameNS }}
            {{- $caFile = default "/etc/anvil-agents/ateapi-ca/ca.crt" $caFile }}
            {{- end }}
            {{- with $caFile }}
            - --substrate-ca-file={{ . }}
            {{- end }}
            {{- if and $caName (not $caSameNS) }}
            - --substrate-ca-configmap={{ $caName }}
            - --substrate-ca-configmap-namespace={{ $caNS }}
            - --substrate-ca-configmap-key={{ $caKey }}
            {{- end }}
            {{- with .Values.substrate.tlsServerName }}
            - --substrate-tls-server-name={{ . }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if ne $archiveMode "disabled" }}
            - name: ANVIL_AGENTS_ARCHIVE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "anvil-agents.archiveSecretName" . | quote }}
                  key: {{ include "anvil-agents.archiveSecretKey" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
{{ toYaml . | indent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
{{ toYaml . | indent 12 }}
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          {{- $caName := "" }}
          {{- $caNS := "" }}
          {{- $caKey := "ca.crt" }}
          {{- if .Values.substrate.ca }}
          {{- $caName = default "" .Values.substrate.ca.configMapName }}
          {{- $caNS = default "" .Values.substrate.ca.namespace }}
          {{- $caKey = default "ca.crt" .Values.substrate.ca.key }}
          {{- end }}
          {{- $caSameNS := and $caName (or (eq $caNS "") (eq $caNS .Release.Namespace)) }}
          {{- $tokenProjected := false }}
          {{- if .Values.substrate.token }}
          {{- $tokenProjected = .Values.substrate.token.projected }}
          {{- end }}
          {{- $tokenMount := "/var/run/secrets/tokens/ate-api" }}
          {{- if and .Values.substrate.token .Values.substrate.token.mountPath }}
          {{- $tokenMount = .Values.substrate.token.mountPath }}
          {{- end }}
          {{- $mounts := concat (list) (.Values.extraVolumeMounts | default list) }}
          {{- if $caSameNS }}
          {{- $mounts = append $mounts (dict "name" "ateapi-ca" "mountPath" "/etc/anvil-agents/ateapi-ca" "readOnly" true) }}
          {{- end }}
          {{- if $tokenProjected }}
          {{- $mounts = append $mounts (dict "name" "ate-client-token" "mountPath" $tokenMount "readOnly" true) }}
          {{- end }}
          {{- if $mounts }}
          volumeMounts:
{{ toYaml $mounts | indent 12 }}
          {{- end }}
      {{- $volumes := concat (list) (.Values.extraVolumes | default list) }}
      {{- if $caSameNS }}
      {{- $volumes = append $volumes (dict "name" "ateapi-ca" "configMap" (dict "name" $caName "items" (list (dict "key" $caKey "path" "ca.crt")))) }}
      {{- end }}
      {{- if $tokenProjected }}
      {{- $tokenAudience := "api.ate-system.svc" }}
      {{- $tokenTTL := 3600 }}
      {{- if .Values.substrate.token }}
      {{- $tokenAudience = default $tokenAudience .Values.substrate.token.audience }}
      {{- if .Values.substrate.token.expirationSeconds }}
      {{- $tokenTTL = int .Values.substrate.token.expirationSeconds }}
      {{- end }}
      {{- end }}
      {{- $volumes = append $volumes (dict "name" "ate-client-token" "projected" (dict "sources" (list (dict "serviceAccountToken" (dict "audience" $tokenAudience "expirationSeconds" $tokenTTL "path" "token"))))) }}
      {{- end }}
      {{- if $volumes }}
      volumes:
{{ toYaml $volumes | indent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
