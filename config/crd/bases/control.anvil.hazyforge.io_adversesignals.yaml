---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: adversesignals.control.anvil.hazyforge.io
spec:
  group: control.anvil.hazyforge.io
  names:
    kind: AdverseSignal
    listKind: AdverseSignalList
    plural: adversesignals
    shortNames:
    - adsignal
    singular: adversesignal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.situationRef.name
      name: Situation
      type: string
    - jsonPath: .spec.trigger.reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              dedupeKey:
                description: |-
                  DedupeKey groups separate immutable reports for the same incident inside
                  the situation's configured dedupe window. Empty derives a bounded key from
                  the normalized source and trigger fields.
                maxLength: 256
                type: string
              situationRef:
                description: |-
                  SituationRef selects an existing same-namespace AdverseSituation. The
                  local-only shape prevents reporters from routing evidence across trust
                  boundaries.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              sourceRef:
                description: |-
                  SourceRef identifies the application, controller, CI run, alert, or other
                  system that produced the evidence. It need not refer to a Kubernetes object.
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - kind
                - name
                type: object
              sourceUID:
                description: SourceUID optionally records an immutable source identity.
                maxLength: 256
                type: string
              sourceURL:
                description: |-
                  SourceURL optionally links to human-readable source evidence. The controller
                  treats it as untrusted text and does not fetch it.
                maxLength: 2048
                type: string
              trigger:
                description: Trigger contains the normalized adverse evidence.
                properties:
                  conditionStatus:
                    description: ConditionStatus is the source condition status associated
                      with the report.
                    enum:
                    - "True"
                    - "False"
                    - Unknown
                    type: string
                  conditionType:
                    description: ConditionType is the source condition associated
                      with the report.
                    maxLength: 256
                    type: string
                  message:
                    description: |-
                      Message is bounded, untrusted evidence for the responder. It never grants
                      authority or changes the responder's standing instructions.
                    maxLength: 8192
                    type: string
                  observedAt:
                    description: |-
                      ObservedAt records when the reporter observed the source condition. The
                      controller uses acceptance time, not this untrusted timestamp, for quieting.
                    format: date-time
                    type: string
                  observedGeneration:
                    description: ObservedGeneration records the source generation
                      that produced the report.
                    format: int64
                    minimum: 0
                    type: integer
                  phase:
                    description: Phase is the source system's lifecycle phase at observation
                      time.
                    maxLength: 128
                    type: string
                  reason:
                    description: Reason is a short, machine-readable explanation of
                      the adverse report.
                    maxLength: 256
                    minLength: 1
                    type: string
                  resourceVersion:
                    description: ResourceVersion records the source version that produced
                      the report.
                    maxLength: 256
                    type: string
                required:
                - reason
                type: object
            required:
            - situationRef
            - sourceRef
            - trigger
            type: object
            x-kubernetes-validations:
            - message: AdverseSignal spec is immutable; create a new signal for new
                evidence
              rule: self == oldSelf
            - message: spec.situationRef.name is required
              rule: self.situationRef.name != ''
            - message: spec.sourceRef.kind is required
              rule: self.sourceRef.kind != ''
            - message: spec.sourceRef.name is required
              rule: self.sourceRef.name != ''
          status:
            properties:
              acceptedAt:
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              eventID:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              situationRef:
                description: |-
                  NamespacedObjectReference identifies a Kubernetes object without importing
                  another API group. Namespace may be omitted where same-namespace resolution
                  is part of the containing resource contract.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              situationSequence:
                format: int64
                type: integer
              situationUID:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
