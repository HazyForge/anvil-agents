---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agenttoolsets.control.anvil.hazyforge.io
spec:
  group: control.anvil.hazyforge.io
  names:
    kind: AgentToolSet
    listKind: AgentToolSetList
    plural: agenttoolsets
    shortNames:
    - agtools
    singular: agenttoolset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: Description
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentToolSetSpec is a reusable collection of setup and verification
              contracts for tools supplied by external systems. It does not deploy a
              service or own credentials, identities, networking, storage, or placement;
              those stay with the external service and the consuming harness.
            properties:
              description:
                description: Description explains what integration this tool set exposes.
                type: string
              toolRefs:
                description: ToolRefs is the canonical ordered collection of atomic
                  AgentTools.
                items:
                  description: |-
                    NamespacedObjectReference identifies a Kubernetes object without importing
                    another API group. Namespace may be omitted where same-namespace resolution
                    is part of the containing resource contract.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              tools:
                description: |-
                  Tools are materialized into compatible agent harnesses in declaration
                  order.
                  Deprecated: use toolRefs.
                items:
                  properties:
                    description:
                      description: Description explains what this tool is for during
                        the run.
                      type: string
                    executable:
                      description: Executable is populated for canonical AgentTool
                        resources.
                      properties:
                        name:
                          description: Name is the command name exposed on PATH.
                          maxLength: 253
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                          type: string
                        path:
                          description: Path is a safe relative executable path.
                          maxLength: 253
                          minLength: 1
                          pattern: ^(?:[A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)(?:/(?:[A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+))*$
                          type: string
                      required:
                      - name
                      - path
                      type: object
                    name:
                      description: Name is a stable tool identifier such as kbctl.
                      minLength: 1
                      type: string
                    setupScript:
                      description: |-
                        SetupScript is an optional shell script run by compatible backend
                        adapters after repository checkout and before the agent runtime starts.
                        The script runs in the agent workdir as the agent container user. Keep it
                        idempotent, install into writable agent data volumes or the workdir, and
                        pass credentials through envSecretRefs instead of inline script text.
                      type: string
                    source:
                      description: Source is the structured acquisition plan for a
                        canonical AgentTool.
                      properties:
                        httpArtifact:
                          properties:
                            artifacts:
                              description: Artifacts must contain at most one entry
                                for each platform.
                              items:
                                description: AgentToolHTTPArtifact is one integrity-pinned
                                  HTTP artifact variant.
                                properties:
                                  executablePath:
                                    description: |-
                                      ExecutablePath is the safe relative file path inside an archive. It is
                                      empty only for format=binary.
                                    maxLength: 253
                                    pattern: ^(?:[A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)(?:/(?:[A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+))*$
                                    type: string
                                  format:
                                    description: Format controls safe extraction.
                                    enum:
                                    - binary
                                    - tar.gz
                                    - zip
                                    type: string
                                  platform:
                                    description: AgentToolPlatform selects one runner
                                      operating system and architecture.
                                    properties:
                                      arch:
                                        description: Arch is the Go-style CPU architecture
                                          name.
                                        enum:
                                        - amd64
                                        - arm64
                                        maxLength: 16
                                        type: string
                                      os:
                                        description: OS is the Go-style operating
                                          system name.
                                        enum:
                                        - linux
                                        - darwin
                                        maxLength: 16
                                        type: string
                                    required:
                                    - arch
                                    - os
                                    type: object
                                  sha256:
                                    description: SHA256 is the expected lowercase
                                      artifact digest.
                                    pattern: ^[a-f0-9]{64}$
                                    type: string
                                  url:
                                    description: URL must use HTTPS.
                                    maxLength: 4096
                                    pattern: ^https://[^[:space:]]+$
                                    type: string
                                required:
                                - format
                                - platform
                                - sha256
                                - url
                                type: object
                                x-kubernetes-validations:
                                - message: executablePath must be empty for binary
                                    artifacts and set for archives
                                  rule: (self.format == 'binary' && !has(self.executablePath))
                                    || (self.format != 'binary' && has(self.executablePath))
                              maxItems: 4
                              minItems: 1
                              type: array
                          required:
                          - artifacts
                          type: object
                        inlineScript:
                          description: |-
                            AgentToolInlineScript is a complete executable script installed as the
                            declared executable. It is distinct from setupScript, which is an
                            unrestricted environment-mutating compatibility escape hatch.
                          properties:
                            interpreter:
                              description: |-
                                Interpreter is an argv-form interpreter prefix, for example
                                ["/usr/bin/env", "bash"].
                              items:
                                maxLength: 4096
                                minLength: 1
                                type: string
                              maxItems: 8
                              minItems: 1
                              type: array
                            script:
                              description: Script is the executable script body.
                              maxLength: 1048576
                              minLength: 1
                              type: string
                          required:
                          - interpreter
                          - script
                          type: object
                        ociArtifact:
                          properties:
                            artifacts:
                              description: Artifacts must contain at most one entry
                                for each platform.
                              items:
                                description: AgentToolOCIArtifact is one digest-pinned
                                  OCI artifact variant.
                                properties:
                                  executablePath:
                                    description: ExecutablePath is the safe relative
                                      executable path in the artifact.
                                    maxLength: 253
                                    minLength: 1
                                    pattern: ^(?:[A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+)(?:/(?:[A-Za-z0-9_-][A-Za-z0-9._-]*|\.[A-Za-z0-9_-][A-Za-z0-9._-]*|\.\.[A-Za-z0-9._-]+))*$
                                    type: string
                                  platform:
                                    description: AgentToolPlatform selects one runner
                                      operating system and architecture.
                                    properties:
                                      arch:
                                        description: Arch is the Go-style CPU architecture
                                          name.
                                        enum:
                                        - amd64
                                        - arm64
                                        maxLength: 16
                                        type: string
                                      os:
                                        description: OS is the Go-style operating
                                          system name.
                                        enum:
                                        - linux
                                        - darwin
                                        maxLength: 16
                                        type: string
                                    required:
                                    - arch
                                    - os
                                    type: object
                                  reference:
                                    description: Reference must include a sha256 digest.
                                    maxLength: 4096
                                    pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
                                    type: string
                                required:
                                - executablePath
                                - platform
                                - reference
                                type: object
                              maxItems: 4
                              minItems: 1
                              type: array
                          required:
                          - artifacts
                          type: object
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one tool source must be set
                        rule: '(has(self.httpArtifact) ? 1 : 0) + (has(self.ociArtifact)
                          ? 1 : 0) + (has(self.inlineScript) ? 1 : 0) == 1'
                    specDigest:
                      description: |-
                        SpecDigest is the canonical AgentTool spec digest used for
                        content-addressed cache paths. The resolver owns this field.
                      type: string
                    verifyCommand:
                      description: |-
                        VerifyCommand is an optional argv array run after SetupScript to prove
                        the tool is available, for example ["kbctl", "--version"].
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
