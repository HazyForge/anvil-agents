---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agentskillsets.control.anvil.hazyforge.io
spec:
  group: control.anvil.hazyforge.io
  names:
    kind: AgentSkillSet
    listKind: AgentSkillSetList
    plural: agentskillsets
    shortNames:
    - agskills
    singular: agentskillset
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: Description
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSkillSetSpec is a reusable, backend-neutral instruction pack. Skills
              and optional delegated personas stay together, while independently owned
              tools should use AgentToolSet. Images, workload identities, credentials, and
              placement remain owned by a harness profile or run profile.
            properties:
              description:
                description: Description explains when this capability pack should
                  be selected.
                type: string
              skillRefs:
                description: SkillRefs is the canonical ordered collection of atomic
                  AgentSkills.
                items:
                  description: |-
                    NamespacedObjectReference identifies a Kubernetes object without importing
                    another API group. Namespace may be omitted where same-namespace resolution
                    is part of the containing resource contract.
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              skills:
                description: |-
                  Skills are named instruction packs materialized for the selected harness.
                  Deprecated: use skillRefs.
                items:
                  properties:
                    content:
                      description: |-
                        Content is inline Markdown instruction text injected into the harness
                        prompt layers. Keep durable, broadly reusable skills in repo files and
                        use this field for the run-specific selection or checklist.
                      type: string
                    description:
                      description: Description briefly explains when the skill should
                        be applied.
                      type: string
                    name:
                      description: |-
                        Name is a stable, human-readable skill identifier. It is also used to
                        derive the mounted skill prompt file name.
                      minLength: 1
                      type: string
                    paths:
                      description: |-
                        Paths lists repo-relative skill, docs, runbook, or source files the
                        harness should read before applying this skill.
                      items:
                        type: string
                      type: array
                    sourceRefs:
                      description: |-
                        SourceRefs points at remote skill content that the controller resolves
                        when it creates the AgentRun payload ConfigMap. Use this for protected
                        skill files that should be updated independently of anvil-agents operator
                        releases.
                      items:
                        properties:
                          github:
                            description: GitHub downloads one file from the GitHub
                              Contents API.
                            properties:
                              apiBaseURL:
                                description: |-
                                  APIBaseURL overrides the GitHub API base URL for GitHub Enterprise.
                                  Empty defaults to https://api.github.com. The operator must explicitly
                                  allowlist the host and requires HTTPS unless test-only insecure access is
                                  enabled at process startup.
                                type: string
                              path:
                                description: Path is the repository-relative file
                                  path to download.
                                minLength: 1
                                type: string
                              ref:
                                description: Ref is the full immutable Git commit
                                  object ID used to resolve the source.
                                pattern: ^([0-9a-fA-F]{40}|[0-9a-fA-F]{64})$
                                type: string
                              repository:
                                description: |-
                                  Repository is the owner/name GitHub repository, for example
                                  example/agent-skills.
                                minLength: 1
                                type: string
                            required:
                            - path
                            - ref
                            - repository
                            type: object
                        type: object
                      type: array
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
              subagents:
                description: |-
                  Subagents are named delegated personas used by skills in this set.
                  Deprecated: keep persona composition in the profile/harness compatibility
                  fields until a dedicated canonical role model is introduced.
                items:
                  properties:
                    description:
                      description: Description summarizes the delegated responsibility.
                      type: string
                    name:
                      description: Name is a stable workstream or persona identifier.
                      minLength: 1
                      type: string
                    systemPrompt:
                      description: |-
                        SystemPrompt gives persona-specific instructions. Backends that do not
                        support real subagents should run this as a separately labeled pass.
                      type: string
                    toolNames:
                      description: ToolNames lists tools this subagent/persona is
                        expected to use.
                      items:
                        type: string
                      type: array
                    when:
                      description: When explains when the harness should use this
                        subagent/persona.
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
              tools:
                description: |-
                  Tools are legacy setup and verification contracts required by this skill
                  set. Prefer AgentToolSet when a tool has an independent lifecycle.
                  Deprecated: author a separate AgentTool and select it explicitly.
                items:
                  properties:
                    description:
                      description: Description explains what this tool is for during
                        the run.
                      type: string
                    executable:
                      description: Executable is populated for canonical AgentTool
                        resources.
                      properties:
                        name:
                          description: Name is the command name exposed on PATH.
                          pattern: ^[A-Za-z0-9][A-Za-z0-9._-]*$
                          type: string
                        path:
                          description: Path is a safe relative executable path.
                          minLength: 1
                          type: string
                      required:
                      - name
                      - path
                      type: object
                      x-kubernetes-validations:
                      - message: path must be a safe relative path
                        rule: '!self.path.startsWith(''/'') && self.path.split(''/'').all(p,
                          p != '''' && p != ''.'' && p != ''..'')'
                    name:
                      description: Name is a stable tool identifier such as kbctl.
                      minLength: 1
                      type: string
                    setupScript:
                      description: |-
                        SetupScript is an optional shell script run by compatible backend
                        adapters after repository checkout and before the agent runtime starts.
                        The script runs in the agent workdir as the agent container user. Keep it
                        idempotent, install into writable agent data volumes or the workdir, and
                        pass credentials through envSecretRefs instead of inline script text.
                      type: string
                    source:
                      description: Source is the structured acquisition plan for a
                        canonical AgentTool.
                      properties:
                        httpArtifact:
                          properties:
                            artifacts:
                              description: Artifacts must contain at most one entry
                                for each platform.
                              items:
                                description: AgentToolHTTPArtifact is one integrity-pinned
                                  HTTP artifact variant.
                                properties:
                                  executablePath:
                                    description: |-
                                      ExecutablePath is the safe relative file path inside an archive. It is
                                      empty only for format=binary.
                                    type: string
                                  format:
                                    description: Format controls safe extraction.
                                    enum:
                                    - binary
                                    - tar.gz
                                    - zip
                                    type: string
                                  platform:
                                    description: AgentToolPlatform selects one runner
                                      operating system and architecture.
                                    properties:
                                      arch:
                                        description: Arch is the Go-style CPU architecture
                                          name.
                                        enum:
                                        - amd64
                                        - arm64
                                        type: string
                                      os:
                                        description: OS is the Go-style operating
                                          system name.
                                        enum:
                                        - linux
                                        - darwin
                                        type: string
                                    required:
                                    - arch
                                    - os
                                    type: object
                                  sha256:
                                    description: SHA256 is the expected lowercase
                                      artifact digest.
                                    pattern: ^[a-f0-9]{64}$
                                    type: string
                                  url:
                                    description: URL must use HTTPS.
                                    pattern: ^https://[^[:space:]]+$
                                    type: string
                                required:
                                - format
                                - platform
                                - sha256
                                - url
                                type: object
                                x-kubernetes-validations:
                                - message: executablePath must be empty for binary
                                    artifacts and a safe relative path for archives
                                  rule: (self.format == 'binary' && !has(self.executablePath))
                                    || (self.format != 'binary' && has(self.executablePath)
                                    && self.executablePath != '' && !self.executablePath.startsWith('/')
                                    && self.executablePath.split('/').all(p, p !=
                                    '' && p != '.' && p != '..'))
                              maxItems: 16
                              minItems: 1
                              type: array
                          required:
                          - artifacts
                          type: object
                          x-kubernetes-validations:
                          - message: artifacts must not contain duplicate platforms
                            rule: self.artifacts.all(a, self.artifacts.filter(b, b.platform.os
                              == a.platform.os && b.platform.arch == a.platform.arch).size()
                              == 1)
                        inlineScript:
                          description: |-
                            AgentToolInlineScript is a complete executable script installed as the
                            declared executable. It is distinct from setupScript, which is an
                            unrestricted environment-mutating compatibility escape hatch.
                          properties:
                            interpreter:
                              description: |-
                                Interpreter is an argv-form interpreter prefix, for example
                                ["/usr/bin/env", "bash"].
                              items:
                                type: string
                              maxItems: 8
                              minItems: 1
                              type: array
                            script:
                              description: Script is the executable script body.
                              minLength: 1
                              type: string
                          required:
                          - interpreter
                          - script
                          type: object
                          x-kubernetes-validations:
                          - message: interpreter arguments must not be empty
                            rule: self.interpreter.all(a, a != '')
                        ociArtifact:
                          properties:
                            artifacts:
                              description: Artifacts must contain at most one entry
                                for each platform.
                              items:
                                description: AgentToolOCIArtifact is one digest-pinned
                                  OCI artifact variant.
                                properties:
                                  executablePath:
                                    description: ExecutablePath is the safe relative
                                      executable path in the artifact.
                                    minLength: 1
                                    type: string
                                  platform:
                                    description: AgentToolPlatform selects one runner
                                      operating system and architecture.
                                    properties:
                                      arch:
                                        description: Arch is the Go-style CPU architecture
                                          name.
                                        enum:
                                        - amd64
                                        - arm64
                                        type: string
                                      os:
                                        description: OS is the Go-style operating
                                          system name.
                                        enum:
                                        - linux
                                        - darwin
                                        type: string
                                    required:
                                    - arch
                                    - os
                                    type: object
                                  reference:
                                    description: Reference must include a sha256 digest.
                                    pattern: ^[^[:space:]@]+@sha256:[a-f0-9]{64}$
                                    type: string
                                required:
                                - executablePath
                                - platform
                                - reference
                                type: object
                                x-kubernetes-validations:
                                - message: executablePath must be a safe relative
                                    path
                                  rule: '!self.executablePath.startsWith(''/'') &&
                                    self.executablePath.split(''/'').all(p, p != ''''
                                    && p != ''.'' && p != ''..'')'
                              maxItems: 16
                              minItems: 1
                              type: array
                          required:
                          - artifacts
                          type: object
                          x-kubernetes-validations:
                          - message: artifacts must not contain duplicate platforms
                            rule: self.artifacts.all(a, self.artifacts.filter(b, b.platform.os
                              == a.platform.os && b.platform.arch == a.platform.arch).size()
                              == 1)
                      type: object
                      x-kubernetes-validations:
                      - message: exactly one tool source must be set
                        rule: '(has(self.httpArtifact) ? 1 : 0) + (has(self.ociArtifact)
                          ? 1 : 0) + (has(self.inlineScript) ? 1 : 0) == 1'
                    specDigest:
                      description: |-
                        SpecDigest is the canonical AgentTool spec digest used for
                        content-addressed cache paths. The resolver owns this field.
                      type: string
                    verifyCommand:
                      description: |-
                        VerifyCommand is an optional argv array run after SetupScript to prove
                        the tool is available, for example ["kbctl", "--version"].
                      items:
                        type: string
                      type: array
                  required:
                  - name
                  type: object
                maxItems: 32
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
