---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agentruns.control.anvil.hazyforge.io
spec:
  group: control.anvil.hazyforge.io
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    shortNames:
    - agrun
    singular: agentrun
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.effectSummary.outcome
      name: Effects
      type: string
    - jsonPath: .status.backend
      name: Backend
      type: string
    - jsonPath: .spec.sourceRef.name
      name: Source
      type: string
    - jsonPath: .spec.trigger.reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              docs:
                description: Docs tells the harness which docs/runtime surfaces must
                  be kept aligned.
                properties:
                  notes:
                    description: Notes gives run-specific docs/runtime consistency
                      instructions.
                    type: string
                  paths:
                    description: |-
                      Paths lists operator-facing docs, samples, runbooks, or docs-site files
                      that should be checked or updated when behavior changes.
                    items:
                      type: string
                    type: array
                  policy:
                    description: |-
                      Policy controls how strongly the run must check that docs and runtime
                      match. Empty defaults to Review in the generated prompt.
                    enum:
                    - Disabled
                    - Review
                    - Required
                    type: string
                  runtimePaths:
                    description: |-
                      RuntimePaths lists runtime source, CRDs, manifests, or generated files
                      whose behavior should be checked against the docs.
                    items:
                      type: string
                    type: array
                type: object
              harness:
                properties:
                  backend:
                    description: Backend selects the swappable harness adapter.
                    properties:
                      codex:
                        description: Codex configures the first proof-of-concept backend.
                        properties:
                          additionalArgs:
                            description: AdditionalArgs appends raw arguments to `codex
                              exec`.
                            items:
                              type: string
                            type: array
                          goal:
                            description: |-
                              Goal supplies Codex-specific goal text. The immutable image prompt still
                              takes precedence over this operator-provided goal.
                            type: string
                          goalMode:
                            description: |-
                              GoalMode enables the Codex adapter's non-interactive goal contract. Use
                              it for long-running self-healing work that should continue until the
                              objective is complete or a hard blocker is proven.
                            type: boolean
                          model:
                            description: Model selects the Codex model. Empty uses
                              the worker's Codex default.
                            type: string
                          reasoningEffort:
                            description: ReasoningEffort is passed through as Codex
                              config when set.
                            type: string
                          sandbox:
                            description: |-
                              Sandbox selects the Codex sandbox. Empty defaults to read-only for
                              observe-only runs and workspace-write for mutation-capable intents.
                            enum:
                            - read-only
                            - workspace-write
                            - danger-full-access
                            type: string
                          serviceTier:
                            description: |-
                              ServiceTier selects the Codex service tier. Empty uses the worker default;
                              "default" is regular speed and "priority" is the faster tier when
                              available.
                            type: string
                          verbosity:
                            description: Verbosity is passed through as Codex model_verbosity
                              when set.
                            enum:
                            - low
                            - medium
                            - high
                            type: string
                        type: object
                      custom:
                        description: Custom configures an operator-owned container
                          adapter.
                        properties:
                          args:
                            description: Args overrides the container arguments for
                              a custom backend image.
                            items:
                              type: string
                            type: array
                          command:
                            description: Command overrides the container entrypoint
                              for a custom backend image.
                            items:
                              type: string
                            type: array
                        type: object
                      grokBuild:
                        description: GrokBuild configures the Grok Build adapter and
                          its durable backend.
                        properties:
                          additionalArgs:
                            description: AdditionalArgs appends raw arguments to the
                              Grok Build headless command.
                            items:
                              type: string
                            type: array
                          command:
                            description: |-
                              Command overrides the executable used inside the Grok Build adapter
                              image. Empty lets the image choose grok-build or grok.
                            type: string
                          model:
                            description: |-
                              Model selects the Grok Build model or model profile. Empty uses the
                              adapter default.
                            type: string
                          profile:
                            description: |-
                              Profile selects the Grok Build profile or durable backend identity. Empty
                              uses the adapter default profile.
                            type: string
                          reasoningEffort:
                            description: |-
                              ReasoningEffort selects the Grok reasoning effort when the adapter
                              supports it.
                            type: string
                          serviceTier:
                            description: |-
                              ServiceTier selects the model service tier when the Grok Build adapter
                              supports it. Empty uses the adapter default.
                            type: string
                        type: object
                      hermesAgent:
                        description: HermesAgent configures the Hermes Agent adapter.
                        properties:
                          additionalArgs:
                            description: AdditionalArgs appends raw arguments to the
                              Hermes headless command.
                            items:
                              type: string
                            type: array
                          model:
                            description: |-
                              Model selects the Hermes model profile. Empty uses the adapter default.
                              Hermes Agent should usually be configured for Codex app-server runtime.
                            type: string
                          profile:
                            description: |-
                              Profile selects a Hermes profile or persona when the adapter supports
                              profile-mode homes. Empty uses the adapter default profile.
                            type: string
                          reasoningEffort:
                            description: |-
                              ReasoningEffort selects the model reasoning effort when the Hermes
                              provider supports it.
                            type: string
                          serviceTier:
                            description: |-
                              ServiceTier selects the model service tier when the Hermes provider
                              supports it. Empty uses the adapter default; "default" is regular speed.
                            type: string
                          useCodexAppServer:
                            description: |-
                              UseCodexAppServer asks the Hermes adapter to route OpenAI turns through
                              Codex app-server. Empty/false leaves the image default in control.
                            type: boolean
                        type: object
                      image:
                        description: |-
                          Image selects the agent container image. When empty, built-in backends use
                          the matching controller-configured runner image; custom requires a value.
                        type: string
                      imagePullPolicy:
                        description: ImagePullPolicy controls how Kubernetes pulls
                          the selected image.
                        enum:
                        - Always
                        - IfNotPresent
                        - Never
                        type: string
                      kind:
                        description: Kind selects the harness backend adapter.
                        enum:
                        - codex
                        - openCode
                        - hermesAgent
                        - openClaw
                        - grokBuild
                        - piAgent
                        - custom
                        type: string
                      modelProvider:
                        description: |-
                          ModelProvider selects the model/tool-caller provider for provider-aware
                          harness adapters such as Hermes Agent, OpenClaw, or Pi. It does not select the
                          persistent backend identity; use kind=grokBuild and AgentDataVolume
                          backend=grokBuild for Grok Build's own durable backend. Select concrete
                          models through backend-specific model fields such as hermesAgent.model,
                          openClaw.model, grokBuild.model, piAgent.model, or codex.model. OpenCode
                          does not use this shared selector; set openCode.model to its native
                          provider/model value and inject provider-native authentication instead.
                        enum:
                        - openai-codex
                        - openai
                        - xai
                        type: string
                      openClaw:
                        description: OpenClaw configures the OpenClaw adapter.
                        properties:
                          additionalArgs:
                            description: AdditionalArgs appends raw arguments to the
                              OpenClaw headless command.
                            items:
                              type: string
                            type: array
                          agentId:
                            description: |-
                              AgentID selects the OpenClaw agent identity. Empty uses the adapter
                              default, usually "anvil".
                            type: string
                          local:
                            description: |-
                              Local forces embedded local execution instead of a gateway when the
                              adapter supports both paths.
                            type: boolean
                          model:
                            description: |-
                              Model selects the OpenClaw model reference, for example openai/gpt-5.5.
                              Empty uses the adapter default.
                            type: string
                          serviceTier:
                            description: |-
                              ServiceTier selects the model service tier when the OpenClaw adapter
                              supports it. Empty uses the adapter default; "default" is regular speed.
                            type: string
                          thinking:
                            description: Thinking selects the OpenClaw thinking/reasoning
                              setting when supported.
                            type: string
                        type: object
                      openCode:
                        description: OpenCode configures the provider-native OpenCode
                          CLI adapter.
                        properties:
                          additionalArgs:
                            description: |-
                              AdditionalArgs appends runner-allowlisted presentation and logging
                              arguments to opencode run. Execution, permission, workspace, session,
                              prompt, provider, and model flags are rejected by the runner.
                            items:
                              type: string
                            type: array
                          agent:
                            description: |-
                              Agent selects a configured primary OpenCode agent. Empty uses the default
                              build agent.
                            type: string
                          auto:
                            description: |-
                              Auto approves permission requests that are not explicitly denied by
                              OpenCode configuration. Leave false unless the selected Pod identity,
                              credentials, mounts, and egress are intentionally scoped for mutation.
                            type: boolean
                          format:
                            description: |-
                              Format controls OpenCode run output. Empty defaults to json so Job logs
                              retain machine-readable events.
                            enum:
                            - default
                            - json
                            type: string
                          model:
                            description: |-
                              Model selects a provider-qualified OpenCode model, for example
                              opencode/big-pickle or openai/gpt-5.4. Empty uses OpenCode configuration.
                            type: string
                          pure:
                            description: |-
                              Pure controls whether OpenCode disables external plugins. Empty defaults
                              to true in the built-in runner for deterministic execution.
                            type: boolean
                          variant:
                            description: Variant selects a provider-specific model
                              variant or reasoning effort.
                            type: string
                        type: object
                      piAgent:
                        description: PiAgent configures the Pi coding agent adapter.
                        properties:
                          additionalArgs:
                            description: AdditionalArgs appends raw arguments to the
                              Pi command.
                            items:
                              type: string
                            type: array
                          mode:
                            description: |-
                              Mode selects Pi output mode. Empty defaults to text; json is useful for
                              debugging event streams but text remains the normal AgentRun log mode.
                            enum:
                            - text
                            - json
                            type: string
                          model:
                            description: |-
                              Model selects the Pi model ID, for example grok-4.5 or
                              grok-composer-2.5-fast. Empty uses the adapter default.
                            type: string
                          noSession:
                            description: |-
                              NoSession runs Pi with --no-session for fully ephemeral checks. Empty
                              keeps Pi sessions in the attached data volume.
                            type: boolean
                          provider:
                            description: |-
                              Provider selects the concrete Pi provider name. Empty derives from
                              modelProvider/providerAuthMode; xAI OAuth maps to xai-auth.
                            type: string
                          thinking:
                            description: |-
                              Thinking selects Pi's thinking level when the selected provider/model
                              supports it, such as low, medium, high, xhigh, or max.
                            type: string
                        type: object
                      providerAuthMode:
                        description: |-
                          ProviderAuthMode selects how a provider-aware adapter should authenticate
                          to the selected model provider. For example, modelProvider=xai with
                          providerAuthMode=oauth maps Hermes Agent, OpenClaw, Grok Build, or Pi to
                          subscription-backed OAuth homes while keeping the concrete model selectable
                          through backend-specific model fields such as hermesAgent.model,
                          openClaw.model, grokBuild.model, or piAgent.model. OpenCode uses its native
                          provider/model selector and provider-native environment variables instead.
                        enum:
                        - apiKey
                        - oauth
                        type: string
                    type: object
                  execution:
                    description: Execution selects where the backend runs.
                    properties:
                      affinity:
                        description: Affinity configures Kubernetes pod affinity/anti-affinity/node
                          affinity.
                        properties:
                          nodeAffinity:
                            description: Describes node affinity scheduling rules
                              for the pod.
                            properties:
                              preferredDuringSchedulingIgnoredDuringExecution:
                                description: |-
                                  The scheduler will prefer to schedule pods to nodes that satisfy
                                  the affinity expressions specified by this field, but it may choose
                                  a node that violates one or more of the expressions. The node that is
                                  most preferred is the one with the greatest sum of weights, i.e.
                                  for each node that meets all of the scheduling requirements (resource
                                  request, requiredDuringScheduling affinity expressions, etc.),
                                  compute a sum by iterating through the elements of this field and adding
                                  "weight" to the sum if the node matches the corresponding matchExpressions; the
                                  node(s) with the highest sum are the most preferred.
                                items:
                                  description: |-
                                    An empty preferred scheduling term matches all objects with implicit weight 0
                                    (i.e. it's a no-op). A null preferred scheduling term matches no objects (i.e. is also a no-op).
                                  properties:
                                    preference:
                                      description: A node selector term, associated
                                        with the corresponding weight.
                                      properties:
                                        matchExpressions:
                                          description: A list of node selector requirements
                                            by node's labels.
                                          items:
                                            description: |-
                                              A node selector requirement is a selector that contains values, a key, and an operator
                                              that relates the key and values.
                                            properties:
                                              key:
                                                description: The label key that the
                                                  selector applies to.
                                                type: string
                                              operator:
                                                description: |-
                                                  Represents a key's relationship to a set of values.
                                                  Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                                type: string
                                              values:
                                                description: |-
                                                  An array of string values. If the operator is In or NotIn,
                                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                  the values array must be empty. If the operator is Gt or Lt, the values
                                                  array must have a single element, which will be interpreted as an integer.
                                                  This array is replaced during a strategic merge patch.
                                                items:
                                                  type: string
                                                type: array
                                                x-kubernetes-list-type: atomic
                                            required:
                                            - key
                                            - operator
                                            type: object
                                          type: array
                                          x-kubernetes-list-type: atomic
                                        matchFields:
                                          description: A list of node selector requirements
                                            by node's fields.
                                          items:
                                            description: |-
                                              A node selector requirement is a selector that contains values, a key, and an operator
                                              that relates the key and values.
                                            properties:
                                              key:
                                                description: The label key that the
                                                  selector applies to.
                                                type: string
                                              operator:
                                                description: |-
                                                  Represents a key's relationship to a set of values.
                                                  Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                                type: string
                                              values:
                                                description: |-
                                                  An array of string values. If the operator is In or NotIn,
                                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                  the values array must be empty. If the operator is Gt or Lt, the values
                                                  array must have a single element, which will be interpreted as an integer.
                                                  This array is replaced during a strategic merge patch.
                                                items:
                                                  type: string
                                                type: array
                                                x-kubernetes-list-type: atomic
                                            required:
                                            - key
                                            - operator
                                            type: object
                                          type: array
                                          x-kubernetes-list-type: atomic
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    weight:
                                      description: Weight associated with matching
                                        the corresponding nodeSelectorTerm, in the
                                        range 1-100.
                                      format: int32
                                      type: integer
                                  required:
                                  - preference
                                  - weight
                                  type: object
                                type: array
                                x-kubernetes-list-type: atomic
                              requiredDuringSchedulingIgnoredDuringExecution:
                                description: |-
                                  If the affinity requirements specified by this field are not met at
                                  scheduling time, the pod will not be scheduled onto the node.
                                  If the affinity requirements specified by this field cease to be met
                                  at some point during pod execution (e.g. due to an update), the system
                                  may or may not try to eventually evict the pod from its node.
                                properties:
                                  nodeSelectorTerms:
                                    description: Required. A list of node selector
                                      terms. The terms are ORed.
                                    items:
                                      description: |-
                                        A null or empty node selector term matches no objects. The requirements of
                                        them are ANDed.
                                        The TopologySelectorTerm type implements a subset of the NodeSelectorTerm.
                                      properties:
                                        matchExpressions:
                                          description: A list of node selector requirements
                                            by node's labels.
                                          items:
                                            description: |-
                                              A node selector requirement is a selector that contains values, a key, and an operator
                                              that relates the key and values.
                                            properties:
                                              key:
                                                description: The label key that the
                                                  selector applies to.
                                                type: string
                                              operator:
                                                description: |-
                                                  Represents a key's relationship to a set of values.
                                                  Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                                type: string
                                              values:
                                                description: |-
                                                  An array of string values. If the operator is In or NotIn,
                                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                  the values array must be empty. If the operator is Gt or Lt, the values
                                                  array must have a single element, which will be interpreted as an integer.
                                                  This array is replaced during a strategic merge patch.
                                                items:
                                                  type: string
                                                type: array
                                                x-kubernetes-list-type: atomic
                                            required:
                                            - key
                                            - operator
                                            type: object
                                          type: array
                                          x-kubernetes-list-type: atomic
                                        matchFields:
                                          description: A list of node selector requirements
                                            by node's fields.
                                          items:
                                            description: |-
                                              A node selector requirement is a selector that contains values, a key, and an operator
                                              that relates the key and values.
                                            properties:
                                              key:
                                                description: The label key that the
                                                  selector applies to.
                                                type: string
                                              operator:
                                                description: |-
                                                  Represents a key's relationship to a set of values.
                                                  Valid operators are In, NotIn, Exists, DoesNotExist. Gt, and Lt.
                                                type: string
                                              values:
                                                description: |-
                                                  An array of string values. If the operator is In or NotIn,
                                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                  the values array must be empty. If the operator is Gt or Lt, the values
                                                  array must have a single element, which will be interpreted as an integer.
                                                  This array is replaced during a strategic merge patch.
                                                items:
                                                  type: string
                                                type: array
                                                x-kubernetes-list-type: atomic
                                            required:
                                            - key
                                            - operator
                                            type: object
                                          type: array
                                          x-kubernetes-list-type: atomic
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - nodeSelectorTerms
                                type: object
                                x-kubernetes-map-type: atomic
                            type: object
                          podAffinity:
                            description: Describes pod affinity scheduling rules (e.g.
                              co-locate this pod in the same node, zone, etc. as some
                              other pod(s)).
                            properties:
                              preferredDuringSchedulingIgnoredDuringExecution:
                                description: |-
                                  The scheduler will prefer to schedule pods to nodes that satisfy
                                  the affinity expressions specified by this field, but it may choose
                                  a node that violates one or more of the expressions. The node that is
                                  most preferred is the one with the greatest sum of weights, i.e.
                                  for each node that meets all of the scheduling requirements (resource
                                  request, requiredDuringScheduling affinity expressions, etc.),
                                  compute a sum by iterating through the elements of this field and adding
                                  "weight" to the sum if the node has pods which matches the corresponding podAffinityTerm; the
                                  node(s) with the highest sum are the most preferred.
                                items:
                                  description: The weights of all of the matched WeightedPodAffinityTerm
                                    fields are added per-node to find the most preferred
                                    node(s)
                                  properties:
                                    podAffinityTerm:
                                      description: Required. A pod affinity term,
                                        associated with the corresponding weight.
                                      properties:
                                        labelSelector:
                                          description: |-
                                            A label query over a set of resources, in this case pods.
                                            If it's null, this PodAffinityTerm matches with no Pods.
                                          properties:
                                            matchExpressions:
                                              description: matchExpressions is a list
                                                of label selector requirements. The
                                                requirements are ANDed.
                                              items:
                                                description: |-
                                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                                  relates the key and values.
                                                properties:
                                                  key:
                                                    description: key is the label
                                                      key that the selector applies
                                                      to.
                                                    type: string
                                                  operator:
                                                    description: |-
                                                      operator represents a key's relationship to a set of values.
                                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                                    type: string
                                                  values:
                                                    description: |-
                                                      values is an array of string values. If the operator is In or NotIn,
                                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                      the values array must be empty. This array is replaced during a strategic
                                                      merge patch.
                                                    items:
                                                      type: string
                                                    type: array
                                                    x-kubernetes-list-type: atomic
                                                required:
                                                - key
                                                - operator
                                                type: object
                                              type: array
                                              x-kubernetes-list-type: atomic
                                            matchLabels:
                                              additionalProperties:
                                                type: string
                                              description: |-
                                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                                              type: object
                                          type: object
                                          x-kubernetes-map-type: atomic
                                        matchLabelKeys:
                                          description: |-
                                            MatchLabelKeys is a set of pod label keys to select which pods will
                                            be taken into consideration. The keys are used to lookup values from the
                                            incoming pod labels, those key-value labels are merged with `labelSelector` as `key in (value)`
                                            to select the group of existing pods which pods will be taken into consideration
                                            for the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming
                                            pod labels will be ignored. The default value is empty.
                                            The same key is forbidden to exist in both matchLabelKeys and labelSelector.
                                            Also, matchLabelKeys cannot be set when labelSelector isn't set.
                                          items:
                                            type: string
                                          type: array
                                          x-kubernetes-list-type: atomic
                                        mismatchLabelKeys:
                                          description: |-
                                            MismatchLabelKeys is a set of pod label keys to select which pods will
                                            be taken into consideration. The keys are used to lookup values from the
                                            incoming pod labels, those key-value labels are merged with `labelSelector` as `key notin (value)`
                                            to select the group of existing pods which pods will be taken into consideration
                                            for the incoming pod's pod (anti) affinity. Keys that don't exist in the incoming
                                            pod labels will be ignored. The default value is empty.
                                            The same key is forbidden to exist in both mismatchLabelKeys and labelSelector.
                                            Also, mismatchLabelKeys cannot be set when labelSelector isn't set.
                                          items:
                                            type: string
                                          type: array
                                          x-kubernetes-list-type: atomic
                                        namespaceSelector:
                                          description: |-
                                            A label query over the set of namespaces that the term applies to.
                                            The term is applied to the union of the namespaces selected by this field
                                            and the ones listed in the namespaces field.
                                            null selector and null or empty namespaces list means "this pod's namespace".
                                            An empty selector ({}) matches all namespaces.
                                          properties:
                                            matchExpressions:
                                              description: matchExpressions is a list
                                                of label selector requirements. The
                                                requirements are ANDed.
                                              items:
                                                description: |-
                                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                                  relates the key and values.
                                                properties:
                                                  key:
                                                    description: key is the label
                                                      key that the selector applies
                                                      to.
                                                    type: string
                                                  operator:
                                                    description: |-
                                                      operator represents a key's relationship to a set of values.
                                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                                    type: string
                                                  values:
                                                    description: |-
                                                      values is an array of string values. If the operator is In or NotIn,
                                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                                      the values array must be empty. This array is replaced during a strategic
                                                      merge patch.
                                                    items:
                                                      type: string
                                                    type: array
                                                    x-kubernetes-list-type: atomic
                                                required:
                                                - key
                                                - operator
                                                type: object
                                              type: array
                                              x-kubernetes-list-type: atomic
                                            matchLabels:
                                              additionalProperties:
                                                type: string
                                              description: |-
