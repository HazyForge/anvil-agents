---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: agentmcpservers.control.anvil.hazyforge.io
spec:
  group: control.anvil.hazyforge.io
  names:
    kind: AgentMCPServer
    listKind: AgentMCPServerList
    plural: agentmcpservers
    shortNames:
    - agmcp
    singular: agentmcpserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.description
      name: Description
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentMCPServerSpec defines one secret-free MCP server contract.
            properties:
              description:
                description: Description explains the server's bounded purpose.
                type: string
              toolAllowlist:
                description: |-
                  ToolAllowlist restricts the MCP tool names exposed to the model. Empty
                  allows all tools reported by tools/list.
                items:
                  type: string
                maxItems: 256
                type: array
              transport:
                description: AgentMCPTransport is an exclusive MCP transport union.
                properties:
                  stdio:
                    description: |-
                      AgentMCPStdioTransport launches an MCP server as a child process. The first
                      argv entry must be supplied by a selected AgentTool or the harness image.
                    properties:
                      command:
                        description: Command is the complete argv vector; shell evaluation
                          is never used.
                        items:
                          type: string
                        maxItems: 64
                        minItems: 1
                        type: array
                      requiredEnv:
                        description: RequiredEnv lists environment-variable names
                          that must exist at preflight.
                        items:
                          type: string
                        maxItems: 64
                        type: array
                    required:
                    - command
                    type: object
                    x-kubernetes-validations:
                    - message: command arguments must not be empty
                      rule: self.command.all(a, a != ”)
                    - message: requiredEnv must contain unique environment-variable
                        names
                      rule: '!has(self.requiredEnv) || (self.requiredEnv.all(e, e.matches(''^[A-Z_][A-Z0-9_]*$''))
                        && self.requiredEnv.all(e, self.requiredEnv.filter(x, x ==
                        e).size() == 1))'
                  streamableHTTP:
                    description: AgentMCPStreamableHTTPTransport connects to a Streamable
                      HTTP MCP endpoint.
                    properties:
                      endpoint:
                        description: Endpoint must use HTTPS and cannot contain embedded
                          credentials.
                        pattern: ^https://[^@/?#]+(?::[0-9]+)?(?:/[^?#]*)?$
                        type: string
                      headers:
                        description: |-
                          Headers map header names to environment variables; values never appear in
                          the CR or immutable payload.
                        items:
                          description: |-
                            AgentMCPHTTPHeader maps a non-secret HTTP header name to an environment
                            variable populated by the harness identity/credential envelope.
                          properties:
                            envVar:
                              pattern: ^[A-Z_][A-Z0-9_]*$
                              type: string
                            name:
                              pattern: ^[A-Za-z0-9][A-Za-z0-9-]*$
                              type: string
                          required:
                          - envVar
                          - name
                          type: object
                        maxItems: 32
                        type: array
                      requiredEnv:
                        description: |-
                          RequiredEnv lists additional environment-variable names required by the
                          server integration.
                        items:
                          type: string
                        maxItems: 64
                        type: array
                    required:
                    - endpoint
                    type: object
                    x-kubernetes-validations:
                    - message: header names must be unique
                      rule: '!has(self.headers) || self.headers.all(h, self.headers.filter(x,
                        x.name == h.name).size() == 1)'
                    - message: requiredEnv must contain unique environment-variable
                        names
                      rule: '!has(self.requiredEnv) || (self.requiredEnv.all(e, e.matches(''^[A-Z_][A-Z0-9_]*$''))
                        && self.requiredEnv.all(e, self.requiredEnv.filter(x, x ==
                        e).size() == 1))'
                type: object
                x-kubernetes-validations:
                - message: exactly one of stdio or streamableHTTP must be set
                  rule: has(self.stdio) != has(self.streamableHTTP)
            required:
            - transport
            type: object
            x-kubernetes-validations:
            - message: toolAllowlist must contain unique non-empty tool names
              rule: '!has(self.toolAllowlist) || (self.toolAllowlist.all(t, t != ”)
                && self.toolAllowlist.all(t, self.toolAllowlist.filter(x, x == t).size()
                == 1))'
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
