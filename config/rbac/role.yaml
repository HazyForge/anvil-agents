apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: anvil-agents-manager-role
rules:
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["adversesituations", "agentdatavolumes", "agentruncontrols", "agentruns", "agentschedules"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources: ["agentrunprofiles", "volumeprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources:
      - adversesituations/status
      - agentdatavolumes/status
      - agentruncontrols/status
      - agentruns/status
      - agentschedules/status
      - volumeprofiles/status
    verbs: ["get", "patch", "update"]
  - apiGroups: ["control.anvil.hazyforge.io"]
    resources:
      - adversesituations/finalizers
      - agentdatavolumes/finalizers
      - agentruns/finalizers
      - agentschedules/finalizers
    verbs: ["update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "pods", "persistentvolumeclaims"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
