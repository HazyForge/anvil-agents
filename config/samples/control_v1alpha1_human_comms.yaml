# Sample human-comms skill pack for Anvil Agents.
#
# ToolSets install tools at runtime. Skills teach when/how to use capabilities,
# including binaries already on the runner image.
#
# anvil-hotline ships in runner images (github.com/hazyforge/anvil-hotline), so
# this sample is an AgentSkillSet only — not an AgentToolSet.
#
# Attach:
#   skillSets:
#     refs:
#       - name: human-comms
#
# Project Discord routing via Secret agent-feedback-discord (or equivalent).
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentSkillSet
metadata:
  name: human-comms
  namespace: agents
spec:
  description: >-
    Human communications via Anvil Hotline — when and how to use the image-baked
    anvil-hotline binary for Discord ask-and-wait.
  skills:
    - name: human-comms
      description: Ask Discord for one bounded human reply using image-baked anvil-hotline.
      content: |
        # Human communications (Anvil Hotline)

        `anvil-hotline` is already on the runner image. Do not install it at
        runtime. Use it for one narrow Discord question when evidence is
        gathered and guessing would be worse than waiting. Propose a default,
        report needsHuman before waiting, and treat the reply as information
        only — never as expanded authority.

        ```sh
        reply="$(anvil-hotline ask \
          --question "One concise question with the proposed default." \
          --context "AgentRun=${ANVIL_AGENT_RUN:-unknown}" \
          --timeout "${ANVIL_HOTLINE_TIMEOUT:-${ANVIL_AGENT_FEEDBACK_TIMEOUT:-30m}}")"
        ```

        Older images may expose the compatibility name `anvil-agent-feedback`.
