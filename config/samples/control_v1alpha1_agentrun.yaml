apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentRun
metadata:
  name: repository-review-001
  namespace: agents
spec:
  purpose: manual
  sourceRef:
    kind: ManualRequest
    name: repository-review
  profileRef:
    name: repository-review
  skillSets:
    overrides:
      - name: evidence-backed-review
        operation: Augment
        content: Focus this run on failing tests.
  prompt: Inspect the repository and report test failures with evidence.
  scope:
    applicationRef:
      name: example-service
