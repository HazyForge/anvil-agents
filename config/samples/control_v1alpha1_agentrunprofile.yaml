apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentRunProfile
metadata:
  name: repository-review
  namespace: agents
spec:
  description: Read-only review with independently reusable runtime and skills.
  scope:
    summary: Review one repository without cluster-wide authority.
    namespaces:
      - agents
  harnessProfileRef:
    name: codex-standard
  capabilities:
    skills:
      selections:
        - skillSetRef:
            name: repository-review
    tools:
      selections:
        - toolSetRef:
            name: repository-tools
    mcpServers:
      selections:
        - mcpSetRef:
            name: organization-context
  harness:
    intent: observe
    systemPrompt: Inspect current evidence and make no mutations.
