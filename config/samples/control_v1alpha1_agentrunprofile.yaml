apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentRunProfile
metadata:
  name: repository-review
  namespace: agents
spec:
  description: Read-only review using a custom harness image.
  scope:
    summary: Review one repository without cluster-wide authority.
    namespaces:
      - agents
  harness:
    intent: observe
    backend:
      kind: custom
      image: ghcr.io/example/agent-harness@sha256:replace-with-a-pinned-digest
      imagePullPolicy: IfNotPresent
    execution:
      serviceAccountName: agent-runner
      timeoutSeconds: 1800
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
    systemPrompt: Inspect current evidence and make no mutations.
