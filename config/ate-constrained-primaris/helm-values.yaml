# Constrained Primaris values for ATE Helm 0.0.8.
#
# DO NOT helm upgrade --install stock 0.0.8. Stock atelet is privileged,
# hostPort 8085/9090, hostPath /var/lib/ateom-gvisor, no nodeSelector.
# Pinning is applied after helm template via
# config/ate-constrained-primaris/patches/pin-one-node.yaml — Helm itself
# has no atelet nodeSelector knob.
#
# Release name MUST be "substrate" in namespace ate-system so the API
# Service is api.ate-system.svc (TLS ServerName Anvil dials).
#
# Apply only after generate-on-actor is in the live Anvil image. Bounded
# acp-spike-smoke-005 bind+generate succeeded; Primaris GitOps may set
# substrate.actorsEnabled/generateOnActor for actorClass acp-spike only.
# Do not list standing-chat. Do not flip the Hazy Trade manager off Job.
#
# helm template does not emit a Namespace unless createNamespace is true.
# StorageClass is not a chart knob; pin-local-storage*.yaml set
# observability-local because hel1-1 cannot provision hcloud-volumes.

createNamespace: true

auth:
  mode: jwt
  jwt:
    # Must equal the ServiceAccount iss claim after the Talos CP patch
    # talos/12-control-plane-sa-oidc-issuer.yaml. ATE 0.0.8 has no JWKS
    # override; ateapi anonymously GETs {issuer}/.well-known/openid-configuration.
    # Do not point this at Omni's SideroLink kube-apiserver VIP
    # https://[fdae:41e4:649b:9303::1]:10000: Cilium IPv6 is off (pods:
    # network unreachable) and anonymous OIDC is 401 until that patch.
    issuer: https://kubernetes.default.svc.cluster.local
    audience: api.ate-system.svc

# Chart default replicas is 6. The valkey-cluster-init Job hardcodes pods
# 0..5, so this overlay must not lower replicas. All six land on hel1-1.
valkey:
  enabled: true
  replicas: 6

# Chart default accessKey/secretKey is rustfsadmin. Override with
# placeholders here; hack/render-ate-constrained.sh requires --secrets
# (gitignored) with rotated keys. Never commit real keys or rustfsadmin
# as values.
rustfs:
  enabled: true
  bucket: ate-snapshots
  accessKey: SET_AT_APPLY_DO_NOT_COMMIT
  secretKey: SET_AT_APPLY_DO_NOT_COMMIT
