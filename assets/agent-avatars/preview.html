<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Anvil Agents faces</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070b09;
        --panel: #0f1613;
        --border: #1c2a24;
        --text: #d5e3db;
        --mute: #6b7c73;
        --emerald: #3dffa8;
        font-family: Barlow, "Segoe UI", system-ui, sans-serif;
      }
      body {
        margin: 0;
        background: #070b09;
        color: var(--text);
        padding: 1.5rem;
      }
      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        color: var(--emerald);
        margin: 0 0 0.35rem;
      }
      p {
        color: var(--mute);
        max-width: 42rem;
        line-height: 1.45;
        font-size: 0.9rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr));
        gap: 0.85rem;
        margin: 1.25rem 0;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.7rem;
        text-align: center;
      }
      .face {
        width: 5.5rem;
        height: 5.5rem;
        margin: 0 auto 0.4rem;
      }
      .face svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .label {
        font-size: 0.75rem;
      }
      .id {
        font-family: ui-monospace, monospace;
        font-size: 0.65rem;
        color: var(--mute);
      }
      .sizes {
        display: flex;
        gap: 1rem;
        align-items: end;
        flex-wrap: wrap;
      }
      .size {
        text-align: center;
        color: var(--mute);
        font-size: 0.7rem;
      }
      .sm { width: 1.75rem; height: 1.75rem; }
      .md { width: 2.75rem; height: 2.75rem; }
      .lg { width: 4rem; height: 4rem; }
      .xl { width: 6.5rem; height: 6.5rem; }
    </style>
  </head>
  <body>
    <h1>Anvil Agents faces</h1>
    <p>
      Shared SVG scene graph with a documented idle/blink hook. No raster portraits.
      Native clients later parse the same named eye groups — this page is the
      portable preview, not a desktop-only CSS demo.
    </p>
    <div class="grid" id="grid"></div>
    <h1>Sizes</h1>
    <div class="sizes" id="sizes"></div>
    <script type="module">
      import scene from "./scene.json" with { type: "json" };
      import animation from "./animation.json" with { type: "json" };
      import { renderFace } from "./render.js";
      import { attachIdle } from "./player.js";

      const grid = document.getElementById("grid");
      for (const face of scene.faces) {
        const card = document.createElement("div");
        card.className = "card";
        const host = document.createElement("div");
        host.className = "face";
        host.innerHTML = renderFace(face, scene);
        const svg = host.querySelector("svg");
        if (svg) {
          attachIdle(svg, animation, { seed: face.id });
        }
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = face.label;
        const id = document.createElement("div");
        id.className = "id";
        id.textContent = face.id;
        card.append(host, label, id);
        grid.append(card);
      }

      const sizes = document.getElementById("sizes");
      for (const size of ["sm", "md", "lg", "xl"]) {
        const wrap = document.createElement("div");
        wrap.className = "size";
        const host = document.createElement("div");
        host.className = `face ${size}`;
        const forge = scene.faces.find((f) => f.id === "forge");
        host.innerHTML = renderFace(forge, scene);
        const svg = host.querySelector("svg");
        if (svg) {
          attachIdle(svg, animation, { seed: `forge-${size}` });
        }
        wrap.append(host, document.createTextNode(size));
        sizes.append(wrap);
      }
    </script>
  </body>
</html>
