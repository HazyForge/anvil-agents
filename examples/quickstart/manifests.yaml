apiVersion: v1
kind: Namespace
metadata:
  name: agents-quickstart
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-runner
  namespace: agents-quickstart
automountServiceAccountToken: false
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: VolumeProfile
metadata:
  name: demo-state
  namespace: agents-quickstart
spec:
  description: Small durable state fixture using the Kind default StorageClass.
  volumes:
    - name: state
      purpose: quickstart-state
      mountPath: /var/lib/anvil-agent
      size:
        request: 64Mi
      accessModes:
        - ReadWriteOnce
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentDataVolume
metadata:
  name: demo-state
  namespace: agents-quickstart
spec:
  agentName: demo
  backend: custom
  profileRef:
    name: demo-state
  profileVolumeName: state
  applicationRef:
    name: quickstart
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentHarnessProfile
metadata:
  name: demo-runtime
  namespace: agents-quickstart
spec:
  description: Credential-free custom harness runtime.
  backend:
    kind: custom
    image: anvil-agents-demo:dev
    imagePullPolicy: Never
  execution:
    serviceAccountName: agent-runner
    dataVolumeRefs:
      - name: demo-state
    timeoutSeconds: 120
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentSkill
metadata:
  name: inspect-mounted-payload
  namespace: agents-quickstart
spec:
  description: Instructions for validating the mounted run contract.
  inline:
    skillMD: Read the mounted prompt and context before reporting success.
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentSkillSet
metadata:
  name: demo-contract
  namespace: agents-quickstart
spec:
  description: Instructions for validating the mounted run contract.
  skillRefs:
    - name: inspect-mounted-payload
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentTool
metadata:
  name: inspect-context
  namespace: agents-quickstart
spec:
  description: Verify the immutable AgentRun context payload exists.
  executable:
    name: inspect-context
    path: inspect-context
  setupScript: ':'
  verifyCommand: ["/bin/sh", "-c", "test -s \"${ANVIL_AGENT_RUN_CONTEXT_FILE}\""]
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentToolSet
metadata:
  name: demo-tools
  namespace: agents-quickstart
spec:
  description: Tool contract included in the resolved quickstart snapshot.
  toolRefs:
    - name: inspect-context
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentRunProfile
metadata:
  name: demo
  namespace: agents-quickstart
spec:
  description: Credential-free custom harness smoke test.
  scope:
    summary: Validate the standalone AgentRun execution contract.
  harnessProfileRef:
    name: demo-runtime
  capabilities:
    skills:
      selections:
        - skillSetRef:
            name: demo-contract
    tools:
      selections:
        - toolSetRef:
            name: demo-tools
  harness:
    intent: observe
    systemPrompt: Read the mounted payload and emit one structured decision.
---
apiVersion: control.anvil.hazyforge.io/v1alpha1
kind: AgentRun
metadata:
  name: demo-001
  namespace: agents-quickstart
spec:
  purpose: manual
  sourceRef:
    kind: ManualRequest
    name: quickstart
  profileRef:
    name: demo
  capabilities:
    skills:
      overrides:
        - name: inspect-mounted-payload
          operation: Augment
          content: Include the resolved composition in the context check.
  prompt: Prove the custom harness payload and status contract works.
  scope:
    applicationRef:
      name: quickstart
