server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Exact /docs is the SPA docs index (do not treat public/docs/ as a dir index).
    location = /docs {
        try_files /index.html =404;
    }

    # Prefer real static files under /docs/* (diagrams), else SPA client routes.
    location /docs/ {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /readyz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/jpeg image/png;
}
