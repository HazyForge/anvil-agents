name: security

# Public-repo security scans (uses free public GitHub Actions minutes).
# Per-container Trivy jobs are first-class check runs so reviewers can see
# that every image was scanned. Primaris release reuses the same script
# (make security-release / TestContract suite security).
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck modules
        run: govulncheck ./...
      - name: govulncheck controller binary
        run: |
          go build -trimpath -o /tmp/anvil-agents ./cmd/anvil-agents
          govulncheck -mode=binary /tmp/anvil-agents

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: true
      - uses: securego/gosec@master
        with:
          # Align with make security-gosec excludes (FPs); CodeQL covers deeper analysis.
          args: >-
            -no-fail=false -fmt=sarif -out=gosec.sarif
            -exclude=G101,G104,G115,G301,G304,G703
            -exclude-dir=web -exclude-dir=charts
            ./cmd/... ./internal/... ./api/... ./lib/...
      - name: Upload gosec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # One visible check run per container so reviewers can see each image scan.
  trivy:
    name: trivy / ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - controller
          - codex
          - opencode
          - grok-build
          - hermes
          - openclaw
          - pi
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh |
            sh -s -- -b /usr/local/bin v0.63.0
          trivy --version
      - name: Build and Trivy-scan container
        env:
          TRIVY_REPORT_DIR: dist/security/trivy
          TRIVY_SEVERITY: HIGH,CRITICAL
          TRIVY_IGNORE_UNFIXED: "true"
        run: |
          set -euo pipefail
          tag="gha-${GITHUB_SHA:0:12}"
          ./hack/security-trivy-images.sh \
            --component "${{ matrix.component }}" \
            --tag "${tag}" \
            --platform linux/amd64 \
            --report-dir "${TRIVY_REPORT_DIR}"
          echo "## Trivy \`${{ matrix.component }}\`" >> "${GITHUB_STEP_SUMMARY}"
          if [[ -f "${TRIVY_REPORT_DIR}/summary.txt" ]]; then
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            cat "${TRIVY_REPORT_DIR}/summary.txt" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
          table="$(ls "${TRIVY_REPORT_DIR}"/*.txt 2>/dev/null | grep -v summary.txt | head -1 || true)"
          if [[ -n "${table}" ]]; then
            echo "### Report" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            head -n 200 "${table}" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.component }}
          path: dist/security/trivy/
          if-no-files-found: warn
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dist/security/trivy/${{ matrix.component }}.sarif
          category: trivy-${{ matrix.component }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  scorecard:
    name: openssf-scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: openssf-scorecard

  security-gate:
    name: security-gate
    needs: [govulncheck, gosec, codeql, trivy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require security jobs (including every container Trivy scan)
        run: |
          set -euo pipefail
          for job in govulncheck gosec codeql trivy; do
            result="${{ needs[job].result }}"
            echo "$job=$result"
            test "$result" = "success"
          done
