name: Publish release

# Publishes images/chart only after the public security program is green.
# Security is GitHub Actions–owned (not Primaris lifecycle).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  GO_VERSION: "1.26.6"
  TRIVY_VERSION: v0.63.0
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - name: Install release test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate release version
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "${RELEASE_TAG}"
      - name: Verify source and generated artifacts
        run: make verify
      - name: Verify clean install, execution, upgrade, and uninstall
        run: make kind-e2e

  security-source:
    name: security / source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          go build -trimpath -o /tmp/anvil-agents ./cmd/anvil-agents
          govulncheck -mode=binary /tmp/anvil-agents
      - name: gosec
        uses: securego/gosec@45b083a0cb42119d61b1e0e364d8c62c68f6f5cd # master
        with:
          args: >-
            -no-fail=false
            -exclude=G101,G104,G115,G301,G304,G703
            -exclude-dir=web -exclude-dir=charts
            ./cmd/... ./internal/... ./api/... ./lib/...
      - uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
      - uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3

  owned-deps:
    name: owned-deps / anvil-hotline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh |
            sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Scan pinned anvil-hotline
        run: |
          set -euo pipefail
          mapfile -t pins < <(
            grep -hRhoE 'ANVIL_HOTLINE_VERSION=[^[:space:]]+' docker/agent-run-*/Dockerfile \
              | sed 's/^ANVIL_HOTLINE_VERSION=//' | sort -u
          )
          test "${#pins[@]}" -eq 1
          ver="${pins[0]}"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          module_json="$(go mod download -json "github.com/hazyforge/anvil-hotline@${ver}")"
          work="$(jq -r '.Dir // empty' <<<"${module_json}")"
          test -n "${work}" && test -d "${work}"
          cd "${work}"
          govulncheck ./...
          go build -trimpath -o /tmp/anvil-hotline ./cmd/anvil-hotline
          /tmp/anvil-hotline thread --help >/dev/null
          govulncheck -mode=binary /tmp/anvil-hotline
          trivy fs --severity "${TRIVY_SEVERITY}" --ignore-unfixed --exit-code 1 .

  trivy-image:
    name: trivy / ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - controller
          - codex
          - opencode
          - grok-build
          - hermes
          - openclaw
          - pi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh |
            sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Build and Trivy-scan container
        env:
          TRIVY_REPORT_DIR: dist/security/trivy
        run: |
          set -euo pipefail
          ./hack/security-trivy-images.sh \
            --component "${{ matrix.component }}" \
            --tag "release-${RELEASE_TAG}" \
            --platform linux/amd64 \
            --report-dir "${TRIVY_REPORT_DIR}"
          echo "## Trivy \`${{ matrix.component }}\` @ \`${RELEASE_TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          cat "${TRIVY_REPORT_DIR}/summary.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-trivy-${{ matrix.component }}-${{ inputs.tag }}
          path: dist/security/trivy/
          if-no-files-found: warn

  publish:
    needs: [verify, security-source, owned-deps, trivy-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4
      - name: Publish local-release artifacts
        shell: bash
        run: |
          registry_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin
          ./hack/publish-release.sh \
            --prefix "${registry_prefix}" \
            --version "${RELEASE_TAG}" \
            --platform linux/amd64 \
            --skip-verification
