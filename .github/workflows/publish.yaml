name: Publish images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: anvil-agents
            dockerfile: Dockerfile
          - image: anvil-agent-run-codex
            dockerfile: docker/agent-run-codex/Dockerfile
          - image: anvil-agent-run-grok-build
            dockerfile: docker/agent-run-grok-build/Dockerfile
          - image: anvil-agent-run-hermes
            dockerfile: docker/agent-run-hermes/Dockerfile
          - image: anvil-agent-run-openclaw
            dockerfile: docker/agent-run-openclaw/Dockerfile
          - image: anvil-agent-run-pi
            dockerfile: docker/agent-run-pi/Dockerfile
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hazyforge/${{ matrix.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
