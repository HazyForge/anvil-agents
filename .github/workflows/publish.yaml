name: Publish release

# Publishes images/chart only after the public security program is green.
# Security is GitHub Actions–owned (not Primaris lifecycle).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  GO_VERSION: "1.26.5"
  TRIVY_VERSION: v0.63.0
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install release test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate release version
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "${RELEASE_TAG}"
      - name: Verify source and generated artifacts
        run: make verify
      - name: Verify clean install, execution, upgrade, and uninstall
        run: make kind-e2e

  security-source:
    name: security / source
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          go build -trimpath -o /tmp/anvil-agents ./cmd/anvil-agents
          govulncheck -mode=binary /tmp/anvil-agents
      - name: gosec
        uses: securego/gosec@master
        with:
          args: >-
            -no-fail=false
            -exclude=G101,G104,G115,G301,G304,G703
            -exclude-dir=web -exclude-dir=charts
            ./cmd/... ./internal/... ./api/... ./lib/...
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  owned-deps:
    name: owned-deps / anvil-hotline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh |
            sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Scan pinned anvil-hotline
        run: |
          set -euo pipefail
          mapfile -t pins < <(
            grep -hRhoE 'ANVIL_HOTLINE_VERSION=[^[:space:]]+' docker/agent-run-*/Dockerfile \
              | sed 's/^ANVIL_HOTLINE_VERSION=//' | sort -u
          )
          test "${#pins[@]}" -eq 1
          ver="${pins[0]}"
          go install golang.org/x/vuln/cmd/govulncheck@latest
          work="$(mktemp -d)"
          git clone --depth 1 --branch "${ver}" \
            https://github.com/HazyForge/anvil-hotline.git "${work}/anvil-hotline"
          cd "${work}/anvil-hotline"
          govulncheck ./...
          go build -trimpath -o /tmp/anvil-hotline ./cmd/anvil-hotline
          govulncheck -mode=binary /tmp/anvil-hotline
          trivy fs --severity "${TRIVY_SEVERITY}" --ignore-unfixed --exit-code 1 .

  trivy-image:
    name: trivy / ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - controller
          - codex
          - opencode
          - grok-build
          - hermes
          - openclaw
          - pi
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Install Trivy
        run: |
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh |
            sh -s -- -b /usr/local/bin "${TRIVY_VERSION}"
      - name: Build and Trivy-scan container
        env:
          TRIVY_REPORT_DIR: dist/security/trivy
        run: |
          set -euo pipefail
          ./hack/security-trivy-images.sh \
            --component "${{ matrix.component }}" \
            --tag "release-${RELEASE_TAG}" \
            --platform linux/amd64 \
            --report-dir "${TRIVY_REPORT_DIR}"
          echo "## Trivy \`${{ matrix.component }}\` @ \`${RELEASE_TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          cat "${TRIVY_REPORT_DIR}/summary.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-trivy-${{ matrix.component }}-${{ inputs.tag }}
          path: dist/security/trivy/
          if-no-files-found: warn

  publish:
    needs: [verify, security-source, owned-deps, trivy-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
      - name: Publish local-release artifacts
        shell: bash
        run: |
          registry_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          ./hack/publish-release.sh \
            --prefix "${registry_prefix}" \
            --version "${RELEASE_TAG}" \
            --platform linux/amd64 \
            --skip-verification
