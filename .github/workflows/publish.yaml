name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install release test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate release version
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "${RELEASE_TAG}"
      - name: Verify source and generated artifacts
        run: make verify
      - name: Verify clean install, execution, upgrade, and uninstall
        run: make kind-e2e

  images:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [controller, codex, grok-build, hermes, openclaw, pi]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          registry_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          revision="$(git rev-parse --short=7 HEAD)"
          ./hack/build-images.sh \
            --component "${{ matrix.component }}" \
            --prefix "${registry_prefix}" \
            --tag "${RELEASE_TAG}" \
            --tag "sha-${revision}" \
            --platform linux/amd64 \
            --push

  chart:
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - uses: azure/setup-helm@v4
      - name: Package and push chart
        shell: bash
        run: |
          registry_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          ./hack/package-chart.sh \
            --version "${RELEASE_TAG}" \
            --output dist \
            --image-prefix "${registry_prefix}"
          helm push "dist/anvil-agents-${RELEASE_TAG#v}.tgz" \
            "oci://${registry_prefix}/charts"
