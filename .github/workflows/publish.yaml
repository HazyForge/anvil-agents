name: Publish images

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: controller
            image: anvil-agents
          - component: codex
            image: anvil-agent-run-codex
          - component: grok-build
            image: anvil-agent-run-grok-build
          - component: hermes
            image: anvil-agent-run-hermes
          - component: openclaw
            image: anvil-agent-run-openclaw
          - component: pi
            image: anvil-agent-run-pi
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        shell: bash
        run: |
          tags=(--tag "sha-${GITHUB_SHA::7}")
          if [[ "${GITHUB_REF}" == "refs/heads/master" ]]; then
            tags+=(--tag latest)
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=(--tag "${GITHUB_REF_NAME//\//-}")
          fi
          ./hack/build-images.sh \
            --component "${{ matrix.component }}" \
            --prefix ghcr.io/hazyforge \
            "${tags[@]}" \
            --platform linux/amd64 \
            --push
