name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install release test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate release version
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "${RELEASE_TAG}"
      - name: Verify source and generated artifacts
        run: make verify
      - name: Verify clean install, execution, upgrade, and uninstall
        run: make kind-e2e

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
      - name: Publish local-release artifacts
        shell: bash
        run: |
          registry_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          ./hack/publish-release.sh \
            --prefix "${registry_prefix}" \
            --version "${RELEASE_TAG}" \
            --platform linux/amd64 \
            --skip-verification
