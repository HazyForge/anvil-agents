name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to republish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install release test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Validate release version
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          git tag --points-at HEAD | grep --fixed-strings --line-regexp "${RELEASE_TAG}"
      - name: Verify source and generated artifacts
        run: make verify
      - name: Verify clean install, execution, upgrade, and uninstall
        run: make kind-e2e

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
          go build -trimpath -o /tmp/anvil-agents ./cmd/anvil-agents
          govulncheck -mode=binary /tmp/anvil-agents
      - name: gosec
        uses: securego/gosec@master
        with:
          args: >-
            -no-fail=false
            -exclude=G101,G104,G115,G301,G304,G703
            -exclude-dir=web -exclude-dir=charts
            ./cmd/... ./internal/... ./api/... ./lib/...
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  # Visible per-container Trivy scans for the release tag (public Actions minutes).
  trivy:
    name: trivy / ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - controller
          - codex
          - opencode
          - grok-build
          - hermes
          - openclaw
          - pi
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh |
            sh -s -- -b /usr/local/bin v0.63.0
          trivy --version
      - name: Build and Trivy-scan container
        env:
          TRIVY_REPORT_DIR: dist/security/trivy
        run: |
          set -euo pipefail
          ./hack/security-trivy-images.sh \
            --component "${{ matrix.component }}" \
            --tag "release-${RELEASE_TAG}" \
            --platform linux/amd64 \
            --report-dir "${TRIVY_REPORT_DIR}"
          echo "## Trivy \`${{ matrix.component }}\` @ \`${RELEASE_TAG}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          cat "${TRIVY_REPORT_DIR}/summary.txt" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-trivy-${{ matrix.component }}-${{ inputs.tag }}
          path: dist/security/trivy/
          if-no-files-found: warn
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dist/security/trivy/${{ matrix.component }}.sarif
          category: release-trivy-${{ matrix.component }}

  publish:
    needs: [verify, security, trivy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4
      - name: Publish local-release artifacts
        shell: bash
        run: |
          registry_prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin
          ./hack/publish-release.sh \
            --prefix "${registry_prefix}" \
            --version "${RELEASE_TAG}" \
            --platform linux/amd64 \
            --skip-verification
