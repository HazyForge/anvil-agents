# One-shot GHCR publish for PR 182. The cloud-agent Cursor App token can
# read HazyForge packages but cannot Write organization package; GitHub
# Actions GITHUB_TOKEN can, matching publish.yaml.
name: Push grok-build (PR 182)

on:
  push:
    branches:
      - cursor/grok-build-start-3a77

permissions:
  contents: read
  packages: write

concurrency:
  group: push-grok-build-182
  cancel-in-progress: true

jobs:
  grok-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push grok-build
        id: push
        run: |
          set -euo pipefail
          short="$(git rev-parse --short=7 HEAD)"
          # Org-root package anvil-agent-run-grok-build is not repo-linked;
          # GITHUB_TOKEN cannot write_package there. Publish a repo-linked
          # name GITHUB_TOKEN is allowed to create, then pin that ref.
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          ./hack/build-images.sh \
            --component grok-build \
            --prefix "${prefix}" \
            --tag "sha-${short}" \
            --platform linux/amd64 \
            --push
          ref="${prefix}/anvil-agent-run-grok-build:sha-${short}"
          digest="$(docker buildx imagetools inspect "${ref}" --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${ref}@${digest}" | tee digest.txt
          echo "Pushed ${ref}@${digest}" >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grok-build-digest
          path: digest.txt
