name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true
      - name: Test
        run: go test ./...
      - name: Generate manifests
        run: make manifests
      - name: Verify generated files
        run: git diff --exit-code
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Lint chart
        run: make helm-lint
      - name: Build controller image
        run: ./hack/build-images.sh --component controller --tag test

  runner-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: codex
          - component: opencode
          - component: grok-build
          - component: hermes
          - component: openclaw
          - component: pi
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build runner image
        run: ./hack/build-images.sh --component "${{ matrix.component }}" --tag test

  kind-e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - name: Install Kind test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Verify upgrade, execution, storage, and uninstall
        run: make kind-e2e

  public-release-judge-e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned judge prerequisites
        run: |
          ./hack/install-judge-prerequisites.sh --install \
            --bin-dir "${RUNNER_TEMP}/anvil-agents-bin"
          echo "${RUNNER_TEMP}/anvil-agents-bin" >> "${GITHUB_PATH}"
      - name: Test the public release without rebuilding Anvil Agents
        run: make judge-kind-e2e
