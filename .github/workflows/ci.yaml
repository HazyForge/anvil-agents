name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
      - name: Test
        run: go test ./...
      - name: Generate manifests
        run: make manifests
      - name: Verify generated files
        run: git diff --exit-code
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: make helm-lint
      - name: Build controller image
        run: ./hack/build-images.sh --component controller --tag test

  runner-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: codex
          - component: grok-build
          - component: hermes
          - component: openclaw
          - component: pi
    steps:
      - uses: actions/checkout@v6
      - name: Build runner image
        run: ./hack/build-images.sh --component "${{ matrix.component }}" --tag test

  kind-e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: 1.25.5
          cache: true
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install Kind test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          go install sigs.k8s.io/kind@v0.27.0
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
      - name: Verify upgrade, execution, storage, and uninstall
        run: make kind-e2e
