// Minimal ateapi Control subset for the Anvil live dialer.
//
// Upstream source: github.com/kagent-dev/substrate (ATE Helm 0.0.8),
// pkg/proto/ateapipb/ateapi.proto at tag v0.0.8. Live Primaris ateapi is that
// chart, not the later agent-substrate Actor-nested CreateActorRequest
// (commit 944abe3) that previously pinned this subset.
//
// ATE 0.0.8 CreateActorRequest is:
//   ObjectRef/ActorRef actor_ref = 1
//   string actor_template_namespace = 2
//   string actor_template_name = 3
//   Selector worker_selector = 4
// Sending only actor.actor_template.atespace (the later proto) fails with
// InvalidArgument: actor_template_namespace is required.
// GetActor/CreateActor return wrapped *Response messages; Resume/Suspend/Pause
// already wrapped Actor. ObjectRef is wire-identical to 0.0.8 ActorRef
// (atespace = 1, name = 2). Actor identity is actor_id + atespace, not
// ResourceMetadata. Status is an enum on Actor field 5 (values 0-6 match
// ACTOR_STATE_*); worker_selector is field 13; atespace is field 15.
//
// This file keeps ONLY the five lifecycle RPCs the Anvil side needs
// (Get/Create/Resume/Suspend/PauseActor) plus the messages they touch.
// Field numbers, package (ateapi), service (Control), and method names are
// copied verbatim so the hand-written stubs stay wire-compatible with ateapi.
// Unknown server fields (ateom pod, snapshots, volumes) are ignored per
// proto3 semantics.
//
// How to refresh:
//  1. Fetch the upstream proto:
//     curl -sL https://raw.githubusercontent.com/kagent-dev/substrate/<tag>/pkg/proto/ateapipb/ateapi.proto -o /tmp/ateapi.proto
//  2. Diff the message/service sections listed below against /tmp/ateapi.proto.
//     If field numbers or RPC signatures changed, update this file to match.
//  3. Run: go test ./internal/substrate/... ; go build ./...
//
// Full-proto alternative: replacing this subset with the complete upstream
// ateapi.proto and generating from it is wire-compatible too, but pulls the
// whole ATE surface into the Anvil module for no spike benefit.

syntax = "proto3";

package ateapi;

option go_package = "github.com/hazyforge/anvil-agents/internal/substrate/ateapipb";

// Control is the primary RPC interface for Agentic Substrate (upstream
// service ateapi.Control). Only the lifecycle subset is bound here.
service Control {
  // Get an Actor.
  rpc GetActor(GetActorRequest) returns (GetActorResponse) {}

  // Create a new Actor deriving from a given ActorTemplate.
  rpc CreateActor(CreateActorRequest) returns (CreateActorResponse) {}

  // Suspend a given actor to a new snapshot.
  rpc SuspendActor(SuspendActorRequest) returns (SuspendActorResponse) {}

  // Pause a given actor and keep its snapshots on node VM.
  rpc PauseActor(PauseActorRequest) returns (PauseActorResponse) {}

  // Resume an actor from its latest snapshot.
  rpc ResumeActor(ResumeActorRequest) returns (ResumeActorResponse) {}
}

// ObjectRef references a Substrate resource by its atespace and name.
// Wire-identical to ATE 0.0.8 ActorRef (atespace = 1, name = 2).
message ObjectRef {
  string atespace = 1;
  string name = 2;
}

// Selector matches worker pools by label (upstream ateapi.Selector:
// match_labels = 1).
message Selector {
  map<string, string> match_labels = 1;
}

// ResourceMetadata is retained for golden-vector coverage of the atespace /
// name / uid / version layout. ATE 0.0.8 Actor does not use it.
message ResourceMetadata {
  string atespace = 1;
  string name = 2;
  string uid = 3;
  int64 version = 4;
}

// Actor is the ATE 0.0.8 lifecycle projection (actor_id = 1, version = 2,
// actor_template_namespace = 3, actor_template_name = 4, status = 5,
// worker_selector = 13, atespace = 15). Later ateapi moved these under
// metadata / actor_template ObjectRef; Helm 0.0.8 has not.
message Actor {
  string actor_id = 1;
  int64 version = 2;
  string actor_template_namespace = 3;
  string actor_template_name = 4;
  ActorState status = 5;
  Selector worker_selector = 13;
  string atespace = 15;
}

// ActorState mirrors ATE 0.0.8 Actor.Status values 0-6. CRASHED/DELETING/
// REVERTING (7-9) arrived in later ateapi and are kept so MapATEState still
// folds them; 0.0.8 never sends them.
enum ActorState {
  ACTOR_STATE_UNSPECIFIED = 0;
  ACTOR_STATE_RESUMING = 1;
  ACTOR_STATE_RUNNING = 2;
  ACTOR_STATE_SUSPENDING = 3;
  ACTOR_STATE_SUSPENDED = 4;
  ACTOR_STATE_PAUSING = 5;
  ACTOR_STATE_PAUSED = 6;
  ACTOR_STATE_CRASHED = 7;
  ACTOR_STATE_DELETING = 8;
  ACTOR_STATE_REVERTING = 9;
}

// ActorStatus is the later nested status message. Kept so enum varint
// encoding stays pinned; ATE 0.0.8 puts the enum directly on Actor.status.
message ActorStatus {
  ActorState state = 1;
}

message GetActorRequest {
  // ATE 0.0.8 names this actor_ref; field number and shape are identical.
  ObjectRef actor = 1;
}

message GetActorResponse {
  Actor actor = 1;
}

// Request to create a new Actor (ATE Helm 0.0.8).
message CreateActorRequest {
  ObjectRef actor_ref = 1;
  string actor_template_namespace = 2;
  string actor_template_name = 3;
  Selector worker_selector = 4;
}

message CreateActorResponse {
  Actor actor = 1;
}

message SuspendActorRequest {
  ObjectRef actor = 1;
}

message SuspendActorResponse {
  Actor actor = 1;
}

message PauseActorRequest {
  ObjectRef actor = 1;
}

message PauseActorResponse {
  Actor actor = 1;
}

message ResumeActorRequest {
  ObjectRef actor = 1;
}

message ResumeActorResponse {
  Actor actor = 1;

  // True if a resume workflow was executed to activate the actor.
  // False if the actor was already RUNNING. ATE 0.0.8 omits this field;
  // proto3 defaults it to false.
  bool resumed = 2;
}
